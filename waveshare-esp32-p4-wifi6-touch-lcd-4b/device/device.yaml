# =============================================================================
# HARDWARE CONFIGURATION - Waveshare ESP32-P4-WIFI6-Touch-LCD-4B
# =============================================================================
# This file describes the physical Waveshare board so ESPHome knows how to
# start the processor, display, touchscreen, backlight, and Wi-Fi coprocessor.
#
# Important hardware notes:
# - The screen is a 4-inch 720x720 MIPI-DSI panel.
# - Touch is handled by a GT911 chip on the I2C bus.
# - Wi-Fi/Bluetooth come from the onboard ESP32-C6 helper chip via SDIO.
# =============================================================================


# -----------------------------------------------------------------------------
# PROCESSOR / BOARD
# -----------------------------------------------------------------------------
esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 32MB
  cpu_frequency: 360MHz
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      # The main task runs the ESPHome loop, and with it LVGL's event dispatch,
      # the scripts, the lambdas and every label update. The IDF default of 3584
      # bytes is not enough for that chain: newlib's full printf (float support
      # is compiled in, see CONFIG_NEWLIB_NANO_FORMAT) needs 1.5-2.5 kB of stack
      # on its own, so the deepest frame -- always somewhere inside printf --
      # ran off the end. That showed up as faults in _Balloc and _svfprintf_r a
      # couple of seconds after boot, once Home Assistant pushed its initial
      # states and the whole sensor -> script -> lvgl -> printf chain ran.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"


# -----------------------------------------------------------------------------
# ESPHOME DEVICE IDENTITY
# -----------------------------------------------------------------------------
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${room}
  on_boot:
    # Late-stage: once HA-controls have restored their values, jump to the
    # configured default page so first-boot landing matches the user's choice.
    priority: -100
    then:
      - delay: 2s
      - script.execute: nav_to_default_page
      # Apply the collapse/placeholder state of the notification row once the
      # collapse_notify switch has restored; without this the empty row would
      # stay visible until the first notification arrives.
      - script.execute: notif_render


# -----------------------------------------------------------------------------
# ESP32-C6 WI-FI COPROCESSOR
# -----------------------------------------------------------------------------
# The ESP32-P4 chip itself has no Wi-Fi. The Waveshare board adds an ESP32-C6
# module connected over SDIO, and ESPHome exposes that using esp32_hosted.
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17


# -----------------------------------------------------------------------------
# PSRAM (External Graphics Memory)
# -----------------------------------------------------------------------------
psram:
  mode: hex
  speed: 200MHz


# -----------------------------------------------------------------------------
# OVER THE AIR UPDATES / API / LOGGING
# -----------------------------------------------------------------------------
ota:
  - platform: esphome

api:
  # Ask HA to (re)send the calendar list as soon as it (re)connects, so the
  # Termine tab is filled right after a device reboot or HA restart instead
  # of waiting for the automation's next 15-minute tick.
  on_client_connected:
    - delay: 3s
    - homeassistant.service:
        service: automation.trigger
        data:
          entity_id: automation.display_kalender_push
  actions:
    # HA-callable: trigger an on-display notification.
    # Usage from Home Assistant:
    #   service: esphome.<device_name>_notify
    #   data:
    #     title: "Drucker"
    #     message: "Druck fertig"
    # expire_hours: 0 = never expire; >0 = auto-dismiss after that many hours
    # (fractional values like 0.5 = 30 min are fine).
    - action: notify
      variables:
        title: string
        message: string
        expire_hours: float
      then:
        - script.execute:
            id: notif_push
            title: !lambda 'return title;'
            message: !lambda 'return message;'
            expire_hours: !lambda 'return expire_hours;'

    # HA-callable: replace the Termine tab's event list. `events` is one
    # newline-separated string, one event per line: "calkey|zeit|titel"
    # (calkeys: travel / termine / pruefung / plan), already sorted by start.
    # Fed by this automation, which must exist in Home Assistant under the
    # entity id automation.display_kalender_push (the on_client_connected
    # hook above triggers it after every reboot/reconnect):
    #
    #   alias: Display Kalender Push
    #   triggers:
    #     - trigger: time_pattern
    #       minutes: "/15"
    #     - trigger: homeassistant
    #       event: start
    #   actions:
    #     - action: calendar.get_events
    #       target:
    #         entity_id:
    #           - calendar.ohm_travel
    #           - calendar.termine
    #           - calendar.ohm_prufungen
    #           - calendar.ohm_stundenplan
    #       data:
    #         start_date_time: "{{ now().isoformat() }}"
    #         duration: { days: 7 }
    #       response_variable: ev
    #     - action: esphome.<geraetename>_calendar_events
    #       data:
    #         events: >-
    #           {% set keys = {'calendar.ohm_travel': 'travel',
    #                          'calendar.termine': 'termine',
    #                          'calendar.ohm_prufungen': 'pruefung',
    #                          'calendar.ohm_stundenplan': 'plan'} %}
    #           {% set wd = ['Mo','Di','Mi','Do','Fr','Sa','So'] %}
    #           {% set ns = namespace(items=[]) %}
    #           {% for cal, data in ev.items() %}
    #             {% for e in data['events'] %}
    #               {% set dt = e.start | as_datetime | as_local %}
    #               {% set allday = 'T' not in e.start %}
    #               {% if dt.date() == now().date() %}
    #                 {% set tag = 'Heute' %}
    #               {% elif dt.date() == (now() + timedelta(days=1)).date() %}
    #                 {% set tag = 'Morgen' %}
    #               {% else %}
    #                 {% set tag = wd[dt.weekday()] ~ ' ' ~ dt.strftime('%d.%m.') %}
    #               {% endif %}
    #               {% set zeit = tag if allday else tag ~ ' ' ~ dt.strftime('%H:%M') %}
    #               {% set line = e.start ~ '~' ~ keys[cal] ~ '|' ~ zeit ~ '|'
    #                             ~ (e.summary | replace('|', ' ') | replace('\n', ' ')) %}
    #               {% set ns.items = ns.items + [line] %}
    #             {% endfor %}
    #           {% endfor %}
    #           {{ (ns.items | sort | join('\n')) | regex_replace('(^|\n)[^~\n]*~', '\\1') }}
    - action: calendar_events
      variables:
        events: string
      then:
        - lambda: |-
            id(cal_events).clear();
            size_t pos = 0;
            while (pos < events.size()) {
              size_t nl = events.find('\n', pos);
              if (nl == std::string::npos) nl = events.size();
              std::string line = events.substr(pos, nl - pos);
              if (!line.empty()) id(cal_events).push_back(line);
              pos = nl + 1;
            }
        - script.execute: cal_render

logger:
  hardware_uart: UART0


# -----------------------------------------------------------------------------
# POWER FOR THE MIPI-DSI DISPLAY PHY
# -----------------------------------------------------------------------------
esp_ldo:
  - channel: 3
    voltage: 2.5V


# -----------------------------------------------------------------------------
# BACKLIGHT CONTROL
# -----------------------------------------------------------------------------
# The Waveshare 4B backlight is driven by GPIO26. It is inverted, so ESPHome
# needs to treat "on" and "off" the opposite way around at the pin level.
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO26
    frequency: 100Hz
    inverted: true
    min_power: 0.0
    max_power: 0.8


# -----------------------------------------------------------------------------
# I2C BUS (Touchscreen Communication)
# -----------------------------------------------------------------------------
i2c:
  id: touchscreen_bus
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz


# -----------------------------------------------------------------------------
# TOUCHSCREEN (GT911 Controller)
# -----------------------------------------------------------------------------
touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: touchscreen_bus
    display: my_display
    on_touch:
      # Tap-to-wake: turning the backlight on resumes LVGL via
      # backlight.yaml's on_turn_on. When the display is already on this is
      # a no-op. When it was off, LVGL was paused and the touch is consumed
      # by the wake — widgets are not triggered.
      - light.turn_on:
          id: backlight
      # Activity timestamp consumed by the 15s idle-revert interval in lvgl.yaml.
      - lambda: 'id(last_activity_ms) = (uint32_t) millis();'


# -----------------------------------------------------------------------------
# DISPLAY (MIPI-DSI 720x720 LCD)
# -----------------------------------------------------------------------------
# ESPHome has a built-in board profile for this Waveshare panel. That profile
# supplies the panel timings and dimensions; GPIO27 resets the display.
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-P4-86-PANEL
    reset_pin:
      number: GPIO27
      inverted: false
    update_interval: never
    auto_clear_enabled: false
