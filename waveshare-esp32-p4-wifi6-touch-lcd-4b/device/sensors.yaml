  # Eve thermostat HVAC mode. Drives the heating power button on main_page:
  # any non-"off" mode -> button shows checked (orange). The button's on_click
  # also reads this value to decide which mode to send next.
  - platform: homeassistant
    entity_id: climate.eve_thermo_20ebp1701
    id: heating_main_hvac_mode
    on_value:
      - lvgl.widget.update:
          id: heating_main_power_button
          state:
            checked: !lambda 'return x != std::string("off");'

  - platform: homeassistant
    entity_id: sensor.3d_drucker_druckstatus
    id: printer_status_value
    on_value:
      # Label nur aktualisieren, wenn der Drucker AN ist.
      # Ist er AUS, bleibt das vom binary_sensor gesetzte "Offline" stehen.
      - if:
          condition:
            lambda: 'return id(printer_power_state).state;'
          then:
            - lvgl.label.update:
                id: printer_lab_status_label
                text: !lambda return x;


# =============================================================================
# BINARY SENSORS (On/Off States)
# =============================================================================
# These sensors track on/off states and update button appearances.
# When the sensor is ON (true), the button shows as "checked" (highlighted).
# When the sensor is OFF (false), the button shows as unchecked (dimmed).
# =============================================================================

binary_sensor:
  - platform: homeassistant
    id: printer_power_state
    entity_id: switch.3d_drucker
    trigger_on_initial_state: true
    on_state:
      then:
        - lvgl.widget.update:
            id: printer_power_button
            state:
              checked: !lambda return x;
        - lvgl.widget.update:
            id: printer_lab_power_button
            state:
              checked: !lambda return x;
        - if:
            condition:
              lambda: 'return x;'
            then:
              # Drucker AN: Widgets sichtbar, Label = aktueller Status (falls bekannt)
              - lvgl.widget.update:
                  id: printer_lab_progress_row
                  hidden: false
              - lvgl.widget.update:
                  id: printer_lab_power_row
                  hidden: false
              - if:
                  condition:
                    lambda: 'return id(printer_status_value).has_state();'
                  then:
                    - lvgl.label.update:
                        id: printer_lab_status_label
                        text: !lambda 'return id(printer_status_value).state;'
                  else:
                    - lvgl.label.update:
                        id: printer_lab_status_label
                        text: "--"
            else:
              # Drucker AUS: Widgets ausblenden, Label "Offline"
              - lvgl.widget.update:
                  id: printer_lab_progress_row
                  hidden: true
              - lvgl.widget.update:
                  id: printer_lab_power_row
                  hidden: true
              - lvgl.label.update:
                  id: printer_lab_status_label
                  text: "Offline"
