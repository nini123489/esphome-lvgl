# =============================================================================
# SENSORS - Home Assistant State Synchronization
# =============================================================================
# This file creates sensors that monitor Home Assistant entities and update
# the touchscreen buttons to reflect the current state of your smart devices.
#
# WHY THIS FILE EXISTS:
# When you press a button on the touchscreen, it sends a command to Home
# Assistant. But what if someone turns on a light using their phone, or a
# scene activates automatically? This file ensures the touchscreen display
# always shows the ACTUAL state of each device, not just what was last pressed.
#
# HOW IT WORKS:
# 1. Each sensor subscribes to a Home Assistant entity (switch, sensor, etc.)
# 2. When that entity's state changes, the "on_state" or "on_value" trigger fires
# 3. The trigger updates the corresponding button in lvgl.yaml to show the new state
#
# KEY CONCEPTS:
# - "platform: homeassistant" = reads state directly from Home Assistant
# - "platform: template" = calculates a value using code (lambda)
# - "entity_id:" = the Home Assistant device/entity to monitor
# - "id:" = unique name to reference this sensor elsewhere in ESPHome
# - "trigger_on_initial_state: true" = update button immediately when device boots
# - "lvgl.widget.update" = changes how a button looks on screen
# - "checked: !lambda return x;" = x is the sensor's boolean state (true/false)
#
# RELATIONSHIP TO lvgl.yaml:
# Each sensor here has a matching button in lvgl.yaml:
#   - This file READS state from Home Assistant → updates button appearance
#   - lvgl.yaml SENDS commands to Home Assistant → when button is pressed
# =============================================================================


# =============================================================================
# REGULAR SENSORS (Numeric Values)
# =============================================================================
# These sensors read numeric values like temperature and position.
# They're used to display information or calculate other states.
# =============================================================================

sensor:
  - platform: homeassistant
    entity_id: sensor.eve_room_af92_temperature
    id: nini_room_temp
    on_value:
      - lvgl.label.update:
          id: temperatures
          text: !lambda |-
            char buf[32];
            int out = (int)round(id(outdoor_temperature).state);
            int ind = (int)round(x);
            snprintf(buf, sizeof(buf), "%s° / %s°",
              (out == 2147483647 || out < -100 || out > 100) ? "-" : std::to_string(out).c_str(),
              (ind == 2147483647 || ind < -100 || ind > 100) ? "-" : std::to_string(ind).c_str()
            );
            return std::string(buf);

  - platform: homeassistant
    entity_id: weather.forecast_home
    attribute: temperature
    id: outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures
          text: !lambda |-
            char buf[32];
            int out = (int)round(x);
            int ind = (int)round(id(nini_room_temp).state);
            snprintf(buf, sizeof(buf), "%s° / %s°",
              (out == 2147483647 || out < -100 || out > 100) ? "-" : std::to_string(out).c_str(),
              (ind == 2147483647 || ind < -100 || ind > 100) ? "-" : std::to_string(ind).c_str()
            );
            return std::string(buf);


  # ===========================================================================
  # SENSOR: Heating Current Temperature
  # ===========================================================================
  # WHAT IT MONITORS:
  #   Current temperature reported by the heating thermostat
  #   Watches: climate.office_radiator_thermostat (current_temperature)
  #
  # WHAT IT UPDATES:
  #   The current temperature label and arc on the heating lab page
  #
  # RELATED UI ELEMENT:
  #   lvgl.yaml → heating_lab_current_label, heating_current_arc
  # ===========================================================================
  - platform: homeassistant
    entity_id: climate.office_radiator_thermostat
    id: heating_current_temperature
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: heating_lab_current_value
          text:
            format: "%.1f°C"
            args: [ 'x' ]
      - lvgl.arc.update:
          id: heating_current_arc
          value: !lambda return (int)roundf(x * 2.0f);
      - lvgl.arc.update:
          id: heating_delta_arc
          value: !lambda |-
            float cur = x;
            float tgt = cur;
            if (id(heating_target_temperature).has_state()) {
              tgt = id(heating_target_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v > tgt_v ? cur_v : tgt_v;
      - lvgl.arc.update:
          id: heating_mask_arc
          value: !lambda |-
            float cur = x;
            float tgt = cur;
            if (id(heating_target_temperature).has_state()) {
              tgt = id(heating_target_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v < tgt_v ? cur_v : tgt_v;

  # ===========================================================================
  # SENSOR: Heating Target Temperature
  # ===========================================================================
  # WHAT IT MONITORS:
  #   Target/set temperature reported by the heating thermostat
  #   Watches: climate.office_radiator_thermostat (temperature)
  #
  # WHAT IT UPDATES:
  #   The target temperature label and arc on the heating lab page
  #
  # RELATED UI ELEMENT:
  #   lvgl.yaml → heating_lab_target_label, heating_target_arc
  # ===========================================================================
  - platform: homeassistant
    entity_id: climate.office_radiator_thermostat
    id: heating_target_temperature
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: heating_lab_target_label
          text:
            format: "%.1f°C"
            args: [ 'x' ]
      - lvgl.arc.update:
          id: heating_track_arc
          value: !lambda return (int)roundf(x * 2.0f);
      - lvgl.arc.update:
          id: heating_target_dot_arc
          value: !lambda return (int)roundf(x * 2.0f);
      - lvgl.arc.update:
          id: heating_delta_arc
          value: !lambda |-
            float tgt = x;
            float cur = tgt;
            if (id(heating_current_temperature).has_state()) {
              cur = id(heating_current_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v > tgt_v ? cur_v : tgt_v;
      - lvgl.arc.update:
          id: heating_mask_arc
          value: !lambda |-
            float tgt = x;
            float cur = tgt;
            if (id(heating_current_temperature).has_state()) {
              cur = id(heating_current_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v < tgt_v ? cur_v : tgt_v;

  # ===========================================================================
  # HEATING (main_page Eve thermostat card)
  # ===========================================================================
  # Feeds the heating_main_card on main_page. The target sensor's state is
  # also read by the -/+ button on_click lambdas to compute the new setpoint.
  - platform: homeassistant
    entity_id: climate.eve_thermo_20ebp1701
    id: heating_main_current_temp
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: heating_main_current_label
          text:
            format: "~%.1f°"
            args: [ 'x' ]

  - platform: homeassistant
    entity_id: climate.eve_thermo_20ebp1701
    id: heating_main_target_temp
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: heating_main_target_label
          text:
            format: "%.1f°"
            args: [ 'x' ]

  - platform: homeassistant
    entity_id: sensor.3d_drucker_power
    id: printer_power_value
    on_value:
      - lvgl.label.update:
          id: printer_lab_power_label
          text:
            format: "%.0f"
            args: [ 'x' ]

  - platform: homeassistant
    entity_id: sensor.3d_drucker_druckfortschritt
    id: printer_progress_value
    on_value:
      - lvgl.label.update:
          id: printer_lab_progress_label
          text:
            format: "%.0f"
            args: [ 'x' ]

  # ===========================================================================
  # SOLAR PV SYSTEM — Sonnenbatterie sensors feeding the info_box visualization
  # ===========================================================================
  # Battery SOC (%): updates the status-bar percentage and both view's SOC labels
  # plus the bar widget in the 2x2 grid view.
  - platform: homeassistant
    entity_id: sensor.sonnenbatterie_217105_state_battery_percentage_user
    id: home_battery_soc
    on_value:
      - lvgl.label.update:
          id: battery_percentage
          text:
            format: "%.0f%%"
            args: [ 'x' ]
      - lvgl.label.update:
          id: grid_batt_soc_label
          text:
            format: "%.0f%%"
            args: [ 'x' ]
      - lvgl.bar.update:
          id: grid_batt_bar
          value: !lambda 'return (int)roundf(x);'

  # PV production (W): updates both Solar value labels. Center flow arrow
  # (Solar -> system) is hidden when production is 0.
  - platform: homeassistant
    entity_id: sensor.sonnenbatterie_217105_state_production
    id: pv_production
    on_value:
      - lvgl.label.update:
          id: flow_solar_value
          text:
            format: "%.0f W"
            args: [ 'x' ]
      - lvgl.label.update:
          id: grid_solar_value
          text:
            format: "%.0f W"
            args: [ 'x' ]
      - lvgl.widget.update:
          id: flow_center_solar_arrow
          hidden: !lambda 'return x <= 0.0f;'

  # House consumption (W): updates both Verbrauch value labels. Center flow
  # arrow (system -> House) is hidden when consumption is 0.
  - platform: homeassistant
    entity_id: sensor.sonnenbatterie_217105_state_consumption_current
    id: pv_consumption
    on_value:
      - lvgl.label.update:
          id: flow_house_value
          text:
            format: "%.0f W"
            args: [ 'x' ]
      - lvgl.label.update:
          id: grid_house_value
          text:
            format: "%.0f W"
            args: [ 'x' ]
      - lvgl.widget.update:
          id: flow_center_house_arrow
          hidden: !lambda 'return x <= 0.0f;'

  # Grid in/out (W): positive = export to grid (orange), negative = import (white).
  # Updates arrow + value labels in both views, and swaps which colored label
  # is visible based on sign.
  - platform: homeassistant
    entity_id: sensor.sonnenbatterie_217105_state_grid_inout
    id: pv_grid_inout
    on_value:
      # Center flow arrow (horizontal): left = export to grid, right = import from grid
      - lvgl.label.update:
          id: flow_center_grid_arrow
          text: !lambda 'return x >= 0.0f ? std::string("\xF3\xB0\x9C\xB1") : std::string("\xF3\xB0\x9C\xB4");'
      # Grid-view in-cell arrow (vertical, kept as-is)
      - lvgl.label.update:
          id: grid_grid_arrow
          text: !lambda 'return x >= 0.0f ? std::string("\xF3\xB0\x9C\xB7") : std::string("\xF3\xB0\x9C\xAE");'
      - lvgl.label.update:
          id: flow_grid_value_white
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: flow_grid_value_orange
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: grid_grid_value_white
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: grid_grid_value_orange
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.widget.update:
          id: flow_grid_value_white
          hidden: !lambda 'return x >= 0.0f;'
      - lvgl.widget.update:
          id: flow_grid_value_orange
          hidden: !lambda 'return x <  0.0f;'
      - lvgl.widget.update:
          id: grid_grid_value_white
          hidden: !lambda 'return x >= 0.0f;'
      - lvgl.widget.update:
          id: grid_grid_value_orange
          hidden: !lambda 'return x <  0.0f;'
      # Center flow arrow hidden when there's essentially no grid flow
      - lvgl.widget.update:
          id: flow_center_grid_arrow
          hidden: !lambda 'return fabsf(x) < 0.5f;'

  # Battery in/out (W): positive = discharging (orange), negative = charging (white).
  - platform: homeassistant
    entity_id: sensor.sonnenbatterie_217105_state_battery_inout
    id: pv_battery_inout
    on_value:
      # Center flow arrow (horizontal): left = discharge (from battery to center), right = charge (from center to battery)
      - lvgl.label.update:
          id: flow_center_batt_arrow
          text: !lambda 'return x >= 0.0f ? std::string("\xF3\xB0\x9C\xB1") : std::string("\xF3\xB0\x9C\xB4");'
      # Grid-view in-cell arrow (vertical, kept as-is)
      - lvgl.label.update:
          id: grid_batt_io_arrow
          text: !lambda 'return x >= 0.0f ? std::string("\xF3\xB0\x9C\xB7") : std::string("\xF3\xB0\x9C\xAE");'
      - lvgl.label.update:
          id: flow_batt_value_white
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: flow_batt_value_orange
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: grid_batt_io_value_white
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.label.update:
          id: grid_batt_io_value_orange
          text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x)); return std::string(b);'
      - lvgl.widget.update:
          id: flow_batt_value_white
          hidden: !lambda 'return x >= 0.0f;'
      - lvgl.widget.update:
          id: flow_batt_value_orange
          hidden: !lambda 'return x <  0.0f;'
      - lvgl.widget.update:
          id: grid_batt_io_value_white
          hidden: !lambda 'return x >= 0.0f;'
      - lvgl.widget.update:
          id: grid_batt_io_value_orange
          hidden: !lambda 'return x <  0.0f;'
      # Center flow arrow hidden when there's essentially no battery flow
      - lvgl.widget.update:
          id: flow_center_batt_arrow
          hidden: !lambda 'return fabsf(x) < 0.5f;'

  # ===========================================================================
  # GREETING PAGE — hourly forecast temperatures
  # ===========================================================================
  # Four slots fed by HA template sensors. See plan file for the matching HA
  # template config (Abschnitt 8).
  - platform: homeassistant
    entity_id: sensor.forecast_slot_0_temp
    id: greeting_wx_temp_0_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_temp_0
          text: { format: "%.0f°", args: ['x'] }

  - platform: homeassistant
    entity_id: sensor.forecast_slot_1_temp
    id: greeting_wx_temp_1_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_temp_1
          text: { format: "%.0f°", args: ['x'] }

  - platform: homeassistant
    entity_id: sensor.forecast_slot_2_temp
    id: greeting_wx_temp_2_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_temp_2
          text: { format: "%.0f°", args: ['x'] }

  - platform: homeassistant
    entity_id: sensor.forecast_slot_3_temp
    id: greeting_wx_temp_3_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_temp_3
          text: { format: "%.0f°", args: ['x'] }

# =============================================================================
# TEXT SENSORS (String Values)
# =============================================================================

text_sensor:
  # =========================================================================
  # GREETING PAGE — hourly forecast time + condition (4 slots each)
  # =========================================================================
  # Each "time" sensor receives a HH:MM string straight from the HA template
  # sensor. Each "condition" sensor receives a HA weather condition
  # ("sunny", "cloudy", ...) and the lambda maps it to the matching MDI glyph
  # bytes from icons.yaml. Unknown conditions fall back to cloudy.
  - platform: homeassistant
    entity_id: sensor.forecast_slot_0_time
    id: greeting_wx_time_0_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_time_0
          text: !lambda 'return x;'

  - platform: homeassistant
    entity_id: sensor.forecast_slot_1_time
    id: greeting_wx_time_1_state
    on_value:
      - lvgl.label.update:
          id: greeting_wx_time_1
          text: !lambda 'return x;'

  - platform: homeassistant
    entity_id: sensor.forecast_slot_2_time
    id: greeting_wx_time_2_state
    on_value:
      - lvgl.label.update:
