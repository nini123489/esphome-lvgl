                                                  preset_mode: "{{ pm }}"
                                                variables:
                                                  pm: !lambda |-
                                                    if (id(fan_main_preset).state == "Direkte brise") {
                                                      return std::string("Natürliche brise");
                                                    }
                                                    return std::string("Direkte brise");

                                # Sleep timer, compact in the bottom-right
                                # corner. The entity's own step is 1 minute
                                # over 0..480, which is unusable by touch, so
                                # the buttons move in 15-minute steps and
                                # clamp to the range.
                                - obj:
