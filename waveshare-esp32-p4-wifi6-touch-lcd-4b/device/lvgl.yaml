                                bg_color: $accent_orange

                    # Compact list of metric rows. Each row: icon + name (grows
                    # to push the value right) + value (with arrow for bidi).
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $accent_orange
                              text: $solar_power
                          - label:
                              text: "Solar"
                              text_font: roboto17_font
                              text_color: $text_tertiary
                              flex_grow: 1
                          - label:
                              id: grid_solar_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: $text_primary

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
                              text: $house
                          - label:
                              text: "Verbrauch"
                              text_font: roboto17_font
                              text_color: $text_tertiary
                              flex_grow: 1
                          - label:
                              id: grid_house_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: $text_primary

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
                              text: $transmission_tower
                          - label:
                              text: "Netz"
                              text_font: roboto17_font
                              text_color: $text_tertiary
                              flex_grow: 1
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                flex_align_track: center
                                pad_column: 4
                              widgets:
                                - label:
                                    id: grid_grid_arrow
                                    text: ""
                                    text_font: icon_font_small
                                    text_color: $text_primary
                                - label:
                                    id: grid_grid_value_white
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $text_primary
                                - label:
                                    id: grid_grid_value_orange
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $accent_orange
                                    hidden: true

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          flex_align_track: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
