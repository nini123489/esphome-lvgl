      pad_bottom: 16
      pad_left: 20
      pad_right: 20
      layout:
        type: flex
        flex_flow: column
        pad_row: 12
      widgets:

        - obj:
            width: 100%
            height: 106
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            clickable: false
            widgets:
              - button:
                  id: energy_back_button
                  align: top_left
                  y: 8
                  width: 90
                  height: 90
                  radius: $radius
                  bg_color: $button_control_color
                  pad_all: 0
                  widgets:
                    - label:
                        align: center
                        text_font: $icon_font
                        text_color: $text_primary
                        text: $chevron_left
                  on_click:
                    - script.execute:
                        id: nav_to_page
                        page: "Mehr"
              - label:
                  id: energy_title_label
                  align: top_mid
                  y: 22
                  text: "Energie"
                  text_font: roboto28_font
                  text_color: $text_primary
        - obj:
            id: info_box
            width: 100%
            flex_grow: 1
            styles: control
            clickable: false
            pad_all: 0
            widgets:

              # =====================================================================
              # VIEW A — Energy flow diagram (default visible)
              # =====================================================================
              - obj:
                  id: info_view_flow
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: $padding
                  clickable: false
                  hidden: false
                  layout:
                    type: grid
                    grid_columns: [fr(1), fr(1), fr(1)]
                    grid_rows: [fr(1), fr(1), fr(1)]
                  widgets:
                    # Solar — top arm (col 1, row 0)
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 0
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $accent_orange
                              text: $solar_power
                          - label:
                              text: "Solar"
                              text_font: roboto15_font
                              text_color: $text_tertiary
                          - label:
                              id: flow_solar_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: $text_primary

                    # Netz — left arm (col 0, row 1)
                    - obj:
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 1
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
                              text: $transmission_tower
                          - label:
                              text: "Netz"
                              text_font: roboto15_font
                              text_color: $text_tertiary
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                flex_align_track: center
                              widgets:
                                - label:
                                    id: flow_grid_value_white
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $text_primary
                                - label:
                                    id: flow_grid_value_orange
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $accent_orange
                                    hidden: true

                    # Akku — right arm (col 2, row 1)
                    - obj:
                        grid_cell_column_pos: 2
                        grid_cell_row_pos: 1
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
                              text: $battery_charging
                          - label:
                              text: "Akku"
                              text_font: roboto15_font
                              text_color: $text_tertiary
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                flex_align_track: center
                              widgets:
                                - label:
                                    id: flow_batt_value_white
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $text_primary
                                - label:
                                    id: flow_batt_value_orange
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: $accent_orange
                                    hidden: true

                    # Verbrauch — bottom arm (col 1, row 2)
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 2
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          flex_align_track: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: $text_primary
                              text: $house
                          - label:
                              text: "Verbrauch"
                              text_font: roboto15_font
                              text_color: $text_tertiary
                          - label:
                              id: flow_house_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: $text_primary

                    # Center — flow direction arrows (col 1, row 1)
                    # No layout: children are placed via align inside the cell.
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 1
                        grid_cell_x_align: stretch
                        grid_cell_y_align: stretch
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        widgets:
                          # All center arrows start hidden; the sensor on_value
                          # handlers reveal them as soon as a non-zero flow value
                          # arrives from Home Assistant.
                          # Solar → center (down, hidden when production = 0)
                          - label:
                              id: flow_center_solar_arrow
                              align: top_mid
                              text: $arrow_down_bold
                              text_font: icon_font_small
                              text_color: $accent_orange
                              hidden: true
                          # center → Verbrauch (down, hidden when consumption = 0)
                          - label:
                              id: flow_center_house_arrow
                              align: bottom_mid
                              text: $arrow_down_bold
                              text_font: icon_font_small
                              text_color: $accent_orange
                              hidden: true
                          # Grid: left = export, right = import (hidden when 0)
                          - label:
                              id: flow_center_grid_arrow
                              align: left_mid
                              text: $arrow_left_bold
                              text_font: icon_font_small
                              text_color: $accent_orange
                              hidden: true
                          # Battery: left = discharge, right = charge (hidden when 0)
                          - label:
                              id: flow_center_batt_arrow
                              align: right_mid
                              text: $arrow_left_bold
                              text_font: icon_font_small
                              text_color: $accent_orange
                              hidden: true

              # =====================================================================
              # VIEW B — Battery SOC bar + compact metric list (hidden by default)
              # =====================================================================
              - obj:
                  id: info_view_grid
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_top: 60
                  pad_left: $padding
                  pad_right: $padding
                  pad_bottom: $padding
                  clickable: false
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: column
                    pad_row: 14
                  widgets:
                    # Battery SOC bar block
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          pad_row: 4
                        widgets:
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: space_between
                                flex_align_cross: center
                                flex_align_track: center
                              widgets:
                                - label:
                                    text: "Akku"
                                    text_font: roboto17_font
                                    text_color: $text_tertiary
                                - label:
                                    id: grid_batt_soc_label
                                    text: "--%"
                                    text_font: roboto17_font
                                    text_color: $text_primary
                          - bar:
                              id: grid_batt_bar
                              width: 100%
                              height: 18
                              min_value: 0
                              max_value: 100
                              value: 0
