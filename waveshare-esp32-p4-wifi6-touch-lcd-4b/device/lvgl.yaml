    - id: heating_lab_page
      layout:
        type: flex
        flex_flow: column
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_color: $page_bg_color
      bg_opa: cover

      widgets:
        - obj:
            id: heating_lab_root
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              # Back button
              - button:
                  id: heating_lab_back_button
                  width: 90px
                  height: 90px
                  x: 8
                  y: 51
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: center
                        text: $chevron_left
                  on_click:
                    - script.execute:
                        id: nav_to_page
                        page: "Übersicht"

              # Base track arc
              - arc:
                  id: heating_track_arc
                  x: 90
                  y: 120
                  width: 540
                  height: 540
                  min_value: 20
                  max_value: 64
                  start_angle: 135
                  end_angle: 45
                  rotation: 0
                  value: 44
                  arc_width: 27
                  arc_color: 0x3A3A3A
                  clickable: false
                  adjustable: false
                  indicator:
                    arc_color: 0x3A3A3A
                    arc_width: 0
                  knob:
                    bg_color: $control_inner_color

              # Delta arc between current and target temperatures
              - arc:
                  id: heating_delta_arc
                  x: 90
                  y: 120
                  width: 540
                  height: 540
                  min_value: 20
                  max_value: 64
                  start_angle: 135
                  end_angle: 45
                  rotation: 0
                  value: 44
                  arc_width: 0
                  arc_color: 0x000000
                  indicator:
                    arc_color: $accent_orange
                    arc_width: 27
                  knob:
                    bg_color: 0x000000
                  clickable: false

              # Mask arc to hide the segment below the minimum (track color)
              - arc:
                  id: heating_mask_arc
                  x: 90
                  y: 120
                  width: 540
                  height: 540
                  min_value: 20
                  max_value: 64
                  start_angle: 135
                  end_angle: 45
                  rotation: 0
                  value: 44
                  arc_width: 0
                  arc_color: 0x000000
                  indicator:
                    arc_color: 0x8A3F1E
                    arc_width: 27
                  knob:
                    bg_color: 0x000000
                  clickable: false

              # Dot for current temperature
              - arc:
                  id: heating_current_arc
                  x: 90
                  y: 120
                  width: 540
                  height: 540
                  min_value: 20
                  max_value: 64
                  start_angle: 135
                  end_angle: 45
                  rotation: 0
                  value: 44
                  arc_width: 0
                  arc_color: 0x000000
                  indicator:
                    arc_color: 0x000000
                    arc_width: 0
                  knob:
                    bg_color: 0xFFFFFF
                    border_width: 3
                    border_color: $accent_orange
                  clickable: false

              # Dot for target temperature
              - arc:
                  id: heating_target_dot_arc
                  x: 98
                  y: 128
                  width: 525
                  height: 525
                  min_value: 20
                  max_value: 64
                  start_angle: 135
                  end_angle: 45
                  rotation: 0
                  value: 44
                  arc_width: 0
                  arc_color: 0x000000
                  indicator:
                    arc_color: 0x000000
                    arc_width: 0
                  knob:
                    bg_color: 0xFFFFFF
                    width: 60
                    height: 60
                    radius: 20
                    border_width: 6
                    border_color: $accent_orange
                  clickable: true
                  adjustable: true
                  on_value:
                    - lambda: |-
                        id(heating_lab_pending_target) = (float) x / 2.0f;
                        id(heating_lab_editing) = true;
                        id(heating_lab_hold_deadline) = millis() + 15000;
                    - script.execute: heating_lab_apply_local
                    - script.execute: heating_lab_send_target

              # Mode label
              - label:
                  id: heating_lab_mode_label
                  text: "Heating"
                  text_font: roboto19_font
                  text_color: $accent_orange
                  align: center
                  y: -70

              # Target temperature label (center)
              - label:
                  id: heating_lab_target_label
                  text: "--.-°C"
                  text_font: roboto48_font
                  text_color: $text_primary
                  align: center

              # Current temperature label (below)
              - obj:
                  id: heating_lab_current_row
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: center
                  y: 83
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: center
                    flex_align_track: center
                  widgets:
                    - label:
                        id: heating_lab_current_icon
                        text: $thermometer
                        text_font: icon_font_small
                        text_color: $accent_orange
                        align: center
                        pad_right: 9
                    - label:
                        id: heating_lab_current_value
                        text: "--.-°C"
                        text_font: roboto19_font
                        text_color: $accent_orange
                        align: center

              # Down button (-0.5C)
              - button:
                  id: heating_lab_down_button
                  width: 105px
                  height: 105px
                  x: 240
                  y: 540
                  styles: control
                  radius: 53px
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x7A7A7A
                  widgets:
                    - label:
                        text: "-"
                        text_font: roboto44_font
                        align: center
                        text_color: $text_tertiary
                  on_click:
                    - lambda: |-
                        float base = id(heating_lab_pending_target);
                        if (isnan(base)) {
                          base = (id(heating_target_temperature).has_state() &&
                                  !isnan(id(heating_target_temperature).state))
                                 ? id(heating_target_temperature).state : 20.0f;
                        }
                        float v = base - 0.5f;
                        if (v < 10.0f) v = 10.0f;
                        if (v > 32.0f) v = 32.0f;
                        id(heating_lab_pending_target) = v;
                        id(heating_lab_editing) = true;
                        id(heating_lab_hold_deadline) = millis() + 15000;
                    - script.execute: heating_lab_apply_local
                    - script.execute: heating_lab_send_target

              # Up button (+0.5C)
              - button:
                  id: heating_lab_up_button
                  width: 105px
                  height: 105px
                  x: 390
                  y: 540
                  styles: control
                  radius: 53px
                  bg_opa: TRANSP
                  border_width: 3
                  border_color: 0x7A7A7A
                  widgets:
                    - label:
                        text: "+"
                        text_font: roboto44_font
                        align: center
                        text_color: $text_tertiary
                  on_click:
                    - lambda: |-
                        float base = id(heating_lab_pending_target);
                        if (isnan(base)) {
                          base = (id(heating_target_temperature).has_state() &&
                                  !isnan(id(heating_target_temperature).state))
                                 ? id(heating_target_temperature).state : 20.0f;
                        }
                        float v = base + 0.5f;
                        if (v < 10.0f) v = 10.0f;
                        if (v > 32.0f) v = 32.0f;
                        id(heating_lab_pending_target) = v;
                        id(heating_lab_editing) = true;
                        id(heating_lab_hold_deadline) = millis() + 15000;
                    - script.execute: heating_lab_apply_local
                    - script.execute: heating_lab_send_target

    - id: printer_lab_page
      layout:
