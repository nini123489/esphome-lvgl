                                    text_color: 0xB0B0B0
                                - label:
                                    id: grid_batt_soc_label
                                    text: "--%"
                                    text_font: roboto17_font
                                    text_color: 0xFFFFFF
                          - bar:
                              id: grid_batt_bar
                              width: 100%
                              height: 18
                              min_value: 0
                              max_value: 100
                              value: 0
                              indicator:
                                bg_color: 0xFF8C00

                    # Compact list of metric rows. Each row: icon + name (grows
                    # to push the value right) + value (with arrow for bidi).
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              text: $solar_power
                          - label:
                              text: "Solar"
                              text_font: roboto17_font
                              text_color: 0xB0B0B0
                              flex_grow: 1
                          - label:
                              id: grid_solar_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: 0xFFFFFF

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $house
                          - label:
                              text: "Verbrauch"
                              text_font: roboto17_font
                              text_color: 0xB0B0B0
                              flex_grow: 1
                          - label:
                              id: grid_house_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: 0xFFFFFF

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 12
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $transmission_tower
                          - label:
                              text: "Netz"
