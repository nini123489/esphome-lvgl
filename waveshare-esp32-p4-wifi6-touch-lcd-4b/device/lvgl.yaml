                                                data_template:
                                                  value: "{{ v }}"
                                                variables:
                                                  v: !lambda |-
                                                    float c = id(fan_main_off_delay).has_state()
                                                                ? id(fan_main_off_delay).state : 0.0f;
                                                    float n = c - 15.0f;
                                                    if (n < 0.0f) n = 0.0f;
                                                    return (int) n;
