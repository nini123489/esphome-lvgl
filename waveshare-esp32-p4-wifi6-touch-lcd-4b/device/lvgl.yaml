                    # ===== TAB: Lampe (light.h6022, Govee Desk Light) =====
                    # HA-light-card style: one big vertical slider area on the
                    # right, view/power buttons stacked vertically on the
                    # left. The three views (brightness / color / color temp)
                    # are stacked 100%-size children of the content area; the
                    # side buttons switch them radio-style. All sliders echo
                    # locally while dragging (shared editing guard) and send
                    # exactly one light.turn_on on release.
                    - obj:
                        id: main_stack_light
                        width: 100%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 14
                        scrollbar_mode: "off"
                        scrollable: false
                        hidden: true
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          pad_row: 10
                        widgets:

                          # Title row: name on the left, automation button on the right.
                          # The button only appears while the automation is OFF -- when it
                          # runs, the automation panel below carries its own deactivate
                          # button and this one would be redundant. Visibility is owned by
                          # script light_auto_render.
                          - obj:
                              width: 100%
                              height: 34
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_main: space_between
                                flex_align_cross: center
                                flex_align_track: center
                              widgets:
                                - obj:
                                    width: SIZE_CONTENT
                                    height: SIZE_CONTENT
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "off"
                                    clickable: false
                                    layout:
                                      type: flex
                                      flex_flow: row
                                      flex_align_cross: center
                                      flex_align_track: center
                                      pad_column: 8
                                    widgets:
                                      - label:
                                          text_font: icon_font_small
                                          text_color: $accent_amber
                                          text: $desk_lamp
                                      - label:
                                          text: "Lampe"
                                          text_font: roboto17_font
                                          text_color: $text_primary
                                # Reactivate. Wrapped in an obj because "hidden" on a plain
                                # obj is the pattern used everywhere else in this file, and
                                # the button itself stays a simple label-only button like
                                # scene_abendlicht_button -- no layout on a button.
                                # Runs the HA script rather than a plain turn_on: the script
                                # also clears the manual-override lock, otherwise the master
                                # switch would read "on" while the automation still keeps its
                                # hands off the lamp. Side effect: it also ends night mode.
                                - obj:
                                    id: light_auto_on_box
                                    width: SIZE_CONTENT
                                    height: SIZE_CONTENT
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "off"
                                    scrollable: false
                                    clickable: false
                                    hidden: true
                                    layout:
                                      type: flex
                                      flex_flow: row
                                    widgets:
                                      - button:
                                          id: light_auto_on_button
                                          width: 150
                                          height: 34
                                          pad_all: 0
                                          radius: 17
                                          bg_color: $control_inner_color
                                          border_width: 1
                                          border_color: $border_circle
                                          widgets:
                                            - label:
                                                align: center
                                                text: "Automatik an"
                                                text_font: roboto15_font
                                                text_color: $accent_green
                                          on_click:
                                            - homeassistant.service:
                                                service: script.turn_on
                                                data:
                                                  entity_id: script.automatik_zuruecksetzen

                          # Body: side button column + view content area. Hidden as a whole
                          # while the automation runs (script light_auto_render).
                          - obj:
                              id: light_manual_body
                              width: 100%
                              flex_grow: 1
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              scrollable: false
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                flex_align_track: center
                                pad_column: 12
                              widgets:

                                # Content area: three stacked views
                                - obj:
                                    flex_grow: 1
                                    height: 100%
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "off"
                                    scrollable: false
                                    clickable: false
                                    widgets:

                                      # -------- view: brightness (default) --
                                      - obj:
                                          id: light_view_brightness
                                          width: 100%
                                          height: 100%
                                          bg_opa: TRANSP
                                          border_width: 0
                                          pad_all: 0
                                          scrollbar_mode: "off"
                                          scrollable: false
                                          clickable: false
                                          layout:
                                            type: flex
                                            flex_flow: column
                                            flex_align_cross: center
                                            flex_align_track: center
                                            pad_row: 10
                                          widgets:
                                            - label:
                                                id: light_brightness_label
                                                text: "--%"
                                                text_font: roboto28_font
                                                text_color: $text_primary
                                            - slider:
                                                id: light_brightness_slider
                                                width: 132
                                                flex_grow: 1
                                                min_value: 1
                                                max_value: 100
                                                value: 50
                                                radius: 24
                                                bg_color: $slider_background_color
                                                bg_opa: cover
                                                indicator:
                                                  bg_color: $accent_amber
                                                  radius: 24
                                                # Flat rounded bar instead of
                                                # LVGL's default full-width
                                                # circle knob: negative pads
                                                # shrink the 132x132 base.
                                                # White border keeps it visible
                                                # once the RGB sensor tints the
                                                # knob in the lamp color.
                                                knob:
                                                  bg_color: $slider_knob_color
                                                  radius: 8
                                                  pad_left: -22
                                                  pad_right: -22
                                                  pad_top: -55
                                                  pad_bottom: -55
                                                  border_width: 2
                                                  border_color: 0xFFFFFF
                                                on_value:
                                                  - lambda: |-
                                                      id(light_pending_bri) = (float) x;
                                                      id(light_main_editing) = true;
                                                      id(light_main_hold_deadline) = millis() + 15000;
                                                  - lvgl.label.update:
                                                      id: light_brightness_label
                                                      text:
                                                        format: "%.0f%%"
                                                        args: [ 'id(light_pending_bri)' ]
                                                on_release:
                                                  - homeassistant.service:
                                                      service: light.turn_on
                                                      data:
                                                        entity_id: light.h6022
                                                      data_template:
                                                        brightness_pct: "{{ b }}"
                                                      variables:
                                                        b: !lambda 'return (int)roundf(id(light_pending_bri));'

                                      # -------- view: color (hue + sat) -----
                                      - obj:
                                          id: light_view_color
                                          width: 100%
                                          height: 100%
                                          bg_opa: TRANSP
                                          border_width: 0
                                          pad_all: 0
                                          scrollbar_mode: "off"
                                          scrollable: false
                                          hidden: true
                                          clickable: false
                                          layout:
                                            type: flex
                                            flex_flow: row
                                            flex_align_main: space_evenly
                                            flex_align_cross: center
                                            flex_align_track: center
                                          widgets:
                                            - slider:
                                                id: light_hue_slider
                                                width: 88
                                                height: 100%
                                                min_value: 0
                                                max_value: 360
                                                value: 0
                                                radius: 24
                                                bg_grad: hue_grad
                                                bg_opa: cover
                                                indicator:
                                                  bg_opa: TRANSP
                                                knob:
                                                  bg_color: $slider_knob_color
                                                  radius: 8
                                                  pad_left: -16
                                                  pad_right: -16
                                                  pad_top: -35
                                                  pad_bottom: -35
                                                  border_width: 3
                                                  border_color: 0x1A1A1A
                                                on_value:
                                                  - lambda: |-
                                                      id(light_pending_hue) = (float) x;
                                                      id(light_main_editing) = true;
                                                      id(light_main_hold_deadline) = millis() + 15000;
                                                on_release:
                                                  - homeassistant.service:
                                                      service: light.turn_on
                                                      data:
                                                        entity_id: light.h6022
                                                      data_template:
                                                        hs_color: "{{ [h, s] }}"
                                                      variables:
                                                        h: !lambda 'return (int)roundf(id(light_pending_hue));'
                                                        s: !lambda 'return (int)roundf(id(light_pending_sat));'
                                            - slider:
                                                id: light_sat_slider
                                                width: 88
                                                height: 100%
                                                min_value: 0
                                                max_value: 100
                                                value: 100
                                                radius: 24
                                                bg_grad: sat_grad
                                                bg_opa: cover
                                                indicator:
                                                  bg_opa: TRANSP
                                                knob:
                                                  bg_color: $slider_knob_color
                                                  radius: 8
                                                  pad_left: -16
                                                  pad_right: -16
                                                  pad_top: -35
                                                  pad_bottom: -35
                                                  border_width: 3
                                                  border_color: 0x1A1A1A
                                                on_value:
                                                  - lambda: |-
                                                      id(light_pending_sat) = (float) x;
                                                      id(light_main_editing) = true;
                                                      id(light_main_hold_deadline) = millis() + 15000;
                                                on_release:
                                                  - homeassistant.service:
                                                      service: light.turn_on
                                                      data:
                                                        entity_id: light.h6022
                                                      data_template:
                                                        hs_color: "{{ [h, s] }}"
                                                      variables:
                                                        h: !lambda 'return (int)roundf(id(light_pending_hue));'
                                                        s: !lambda 'return (int)roundf(id(light_pending_sat));'

                                      # -------- view: color temperature -----
                                      # Slider value runs 2000..6535 but is
                                      # inverted when sending (8535 - x) so
                                      # warm sits at the top like the HA card.
                                      - obj:
                                          id: light_view_ct
                                          width: 100%
                                          height: 100%
                                          bg_opa: TRANSP
                                          border_width: 0
                                          pad_all: 0
                                          scrollbar_mode: "off"
                                          scrollable: false
                                          hidden: true
                                          clickable: false
                                          layout:
                                            type: flex
                                            flex_flow: row
                                            flex_align_main: center
                                            flex_align_cross: center
                                            flex_align_track: center
                                          widgets:
                                            - slider:
                                                id: light_ct_slider
                                                width: 132
                                                height: 100%
                                                min_value: 2000
                                                max_value: 6535
                                                value: 4535
                                                radius: 24
                                                bg_grad: ct_grad
                                                bg_opa: cover
                                                indicator:
                                                  bg_opa: TRANSP
                                                knob:
                                                  bg_color: $slider_knob_color
                                                  radius: 8
                                                  pad_left: -22
                                                  pad_right: -22
                                                  pad_top: -55
                                                  pad_bottom: -55
                                                  border_width: 3
                                                  border_color: 0x1A1A1A
                                                on_value:
                                                  - lambda: |-
                                                      float k = 8535.0f - (float) x;
                                                      if (k < 2000.0f) k = 2000.0f;
                                                      if (k > 6535.0f) k = 6535.0f;
                                                      id(light_pending_ct) = k;
                                                      id(light_main_editing) = true;
                                                      id(light_main_hold_deadline) = millis() + 15000;
                                                on_release:
                                                  - homeassistant.service:
                                                      service: light.turn_on
                                                      data:
                                                        entity_id: light.h6022
                                                      data_template:
                                                        color_temp_kelvin: "{{ k }}"
                                                      variables:
                                                        k: !lambda 'return (int)roundf(id(light_pending_ct));'
                                # Side buttons: power, then the three views
                                - obj:
                                    width: 56
                                    height: 100%
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "off"
                                    scrollable: false
                                    clickable: false
                                    layout:
                                      type: flex
                                      flex_flow: column
                                      flex_align_main: center
                                      flex_align_cross: center
                                      flex_align_track: center
                                      pad_row: 10
                                    widgets:
                                      - button:
                                          id: light_power_button
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          text_color: $text_secondary
                                          border_width: 1
                                          border_color: $border_circle
                                          checked:
                                            bg_color: $tint_green
                                            text_color: $accent_green
                                            border_color: $accent_green
                                          checkable: true
                                          widgets:
                                            - label:
                                                align: center
                                                text_font: icon_font_small
                                                text: $power
                                          on_click:
                                            - homeassistant.service:
                                                service: light.toggle
                                                data:
                                                  entity_id: light.h6022
                                      - button:
                                          id: light_view_bri_button
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          text_color: $text_secondary
                                          border_width: 1
                                          border_color: $border_circle
                                          checked:
                                            bg_color: $tint_amber
                                            text_color: $accent_amber
                                            border_color: $accent_amber
                                          checkable: true
                                          state:
                                            checked: true
                                          widgets:
                                            - label:
                                                align: center
                                                text_font: icon_font_small
                                                text: $brightness_mid
                                          on_click:
                                            - lvgl.widget.update:
                                                id: light_view_brightness
                                                hidden: false
                                            - lvgl.widget.update:
                                                id: light_view_color
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_ct
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_bri_button
                                                state:
                                                  checked: true
                                            - lvgl.widget.update:
                                                id: light_view_color_button
                                                state:
                                                  checked: false
                                            - lvgl.widget.update:
                                                id: light_view_ct_button
                                                state:
                                                  checked: false
                                      - button:
                                          id: light_view_color_button
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          text_color: $text_secondary
                                          border_width: 1
                                          border_color: $border_circle
                                          checked:
                                            bg_color: $tint_amber
                                            text_color: $accent_amber
                                            border_color: $accent_amber
                                          checkable: true
                                          widgets:
                                            - label:
                                                align: center
                                                text_font: icon_font_small
                                                text: $palette
                                          on_click:
                                            - lvgl.widget.update:
                                                id: light_view_brightness
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_color
                                                hidden: false
                                            - lvgl.widget.update:
                                                id: light_view_ct
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_bri_button
                                                state:
                                                  checked: false
                                            - lvgl.widget.update:
                                                id: light_view_color_button
                                                state:
                                                  checked: true
                                            - lvgl.widget.update:
                                                id: light_view_ct_button
                                                state:
                                                  checked: false
                                      - button:
                                          id: light_view_ct_button
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          text_color: $text_secondary
                                          border_width: 1
                                          border_color: $border_circle
                                          checked:
                                            bg_color: $tint_amber
                                            text_color: $accent_amber
                                            border_color: $accent_amber
                                          checkable: true
                                          widgets:
                                            - label:
                                                align: center
                                                text_font: icon_font_small
                                                text: $wb_sunny
                                          on_click:
                                            - lvgl.widget.update:
                                                id: light_view_brightness
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_color
                                                hidden: true
                                            - lvgl.widget.update:
                                                id: light_view_ct
                                                hidden: false
                                            - lvgl.widget.update:
                                                id: light_view_bri_button
                                                state:
                                                  checked: false
                                            - lvgl.widget.update:
                                                id: light_view_color_button
                                                state:
                                                  checked: false
                                            - lvgl.widget.update:
                                                id: light_view_ct_button
                                                state:
                                                  checked: true

                          # Automation panel -- replaces the entire control body while the
                          # light automation is running, so the sliders cannot fight it.
                          # "Running" means: master switch on AND manual-override lock off.
                          - obj:
                              id: light_auto_panel
                              width: 100%
                              flex_grow: 1
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              scrollable: false
                              hidden: true
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: column
                                flex_align_main: center
                                flex_align_cross: center
                                flex_align_track: center
                                pad_row: 12
                              widgets:
                                - label:
                                    id: light_auto_status_label
                                    text: "Lichtautomatik aktiv"
                                    text_font: roboto19_font
                                    text_color: $text_primary
                                - button:
                                    id: light_auto_off_button
                                    width: 280
                                    height: 52
                                    pad_all: 0
                                    radius: 26
                                    bg_color: $control_inner_color
                                    border_width: 1
                                    border_color: $border_circle
                                    widgets:
                                      - label:
                                          align: center
                                          text: "Automatik deaktivieren"
                                          text_font: roboto15_font
                                          text_color: $text_secondary
                                    on_click:
                                      - homeassistant.service:
                                          service: input_boolean.turn_off
                                          data:
                                            entity_id: input_boolean.lichtautomatik
                                # Toggle, not a one-way switch: the label and checked state are
                                # rewritten by light_auto_render from the HA boolean.
                                - button:
                                    id: light_auto_night_button
                                    width: 280
                                    height: 52
                                    pad_all: 0
                                    radius: 26
                                    bg_color: $control_inner_color
                                    text_color: $text_secondary
                                    border_width: 1
                                    border_color: $border_circle
                                    checked:
                                      bg_color: $tint_blue
                                      border_color: $accent_blue
                                    checkable: true
                                    widgets:
                                      - label:
                                          text_font: icon_font_small
                                          text_color: $accent_blue
                                          align: left_mid
                                          x: 20
                                          text: $nightlight
                                      - label:
                                          id: light_auto_night_label
                                          align: center
                                          text: "Nachtmodus aktivieren"
                                          text_font: roboto15_font
                                          text_color: $text_secondary
                                    on_click:
                                      - homeassistant.service:
                                          service: input_boolean.toggle
                                          data:
                                            entity_id: input_boolean.nachtmodus


              # ---------------- vertical tab strip (right edge) ---------------
              # Visually separated from the content: own (darker) background
              # plus a divider line on its left edge.
              - obj:
                  id: main_stack_tabs
                  width: 120
                  height: 100%
                  bg_color: $stack_side_bg_color
                  bg_opa: cover
                  radius: 0
                  border_width: 2
                  border_side: LEFT
                  border_color: $divider_tabs
                  pad_all: 8
                  scrollbar_mode: "off"
                  scrollable: false
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_main: center
                    flex_align_cross: center
                    flex_align_track: center
                    # 5 x 52px buttons + 4 x 8px gaps = 292px: still fits the
                    # strip in the smallest card state (two notifications).
                    pad_row: 8
                  widgets:
                    - button:
                        id: main_tab_heat_button
                        width: 96
                        height: 52
                        pad_all: 0
                        radius: 18
                        # Inactive tabs carry no background of their own, only
                        # a dimmed icon; the active one gets a muted tint.
                        bg_opa: TRANSP
                        text_color: $tab_icon_inactive
                        checked:
                          bg_color: $tint_amber
                          bg_opa: cover
                          text_color: $accent_orange
                        checkable: true
                        state:
                          checked: true
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text: $thermometer
                        on_click:
                          - script.execute:
                              id: stack_show_tab
                              tab: "Heizung"
                    - button:
                        id: main_tab_fan_button
                        width: 96
                        height: 52
                        pad_all: 0
                        radius: 18
                        # Inactive tabs carry no background of their own, only
                        # a dimmed icon; the active one gets a muted tint.
                        bg_opa: TRANSP
                        text_color: $tab_icon_inactive
                        checked:
                          bg_color: $tint_blue
                          bg_opa: cover
                          text_color: $accent_blue
                        checkable: true
                        state:
                          checked: false
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text: $fan
                        on_click:
                          - script.execute:
                              id: stack_show_tab
                              tab: "Ventilator"
                    - button:
                        id: main_tab_cal_button
                        width: 96
                        height: 52
                        pad_all: 0
                        radius: 18
                        # Inactive tabs carry no background of their own, only
                        # a dimmed icon; the active one gets a muted tint.
                        bg_opa: TRANSP
                        text_color: $tab_icon_inactive
                        checked:
                          bg_color: $tint_green
                          bg_opa: cover
                          text_color: $accent_green
                        checkable: true
                        state:
                          checked: false
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text: $calendar
                        on_click:
                          - script.execute:
                              id: stack_show_tab
                              tab: "Kalender"
                    - button:
                        id: main_tab_light_button
                        width: 96
                        height: 52
                        pad_all: 0
                        radius: 18
                        # Inactive tabs carry no background of their own, only
                        # a dimmed icon; the active one gets a muted tint.
                        bg_opa: TRANSP
                        text_color: $tab_icon_inactive
                        checked:
                          bg_color: $tint_amber
                          bg_opa: cover
                          text_color: $accent_amber
                        checkable: true
                        state:
                          checked: false
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text: $desk_lamp
                        on_click:
                          - script.execute:
                              id: stack_show_tab
                              tab: "Lampe"
                    - button:
                        id: main_tab_scenes_button
                        width: 96
                        height: 52
                        pad_all: 0
                        radius: 18
                        # Inactive tabs carry no background of their own, only
                        # a dimmed icon; the active one gets a muted tint.
                        bg_opa: TRANSP
                        text_color: $tab_icon_inactive
                        checked:
                          bg_color: $tint_amber
                          bg_opa: cover
                          text_color: $accent_amber
                        checkable: true
                        state:
                          checked: false
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text: $lightbulb
                        on_click:
                          - script.execute:
                              id: stack_show_tab
                              tab: "Szenen"

        # ---------------------------------------------------------------------
        # QUICK BUTTONS — single tiles leading to the detail sub-pages
        # ---------------------------------------------------------------------
        - obj:
            id: main_quick_row
            width: 100%
            height: 96
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            clickable: false
            layout:
              type: flex
              flex_flow: row
              pad_column: 12
            widgets:
              - button:
                  id: main_quick_weather_button
                  flex_grow: 1
                  height: 96
                  pad_all: 0
                  radius: $radius
                  bg_color: $quick_button_color
                  border_width: 1
                  border_color: $border_button
                  widgets:
                    - obj:
                        align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        clickable: false
