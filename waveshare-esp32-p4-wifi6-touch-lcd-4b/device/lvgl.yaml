        # ---------------------------------------------------------------------
        # STACK WIDGET — main control area.
        # Left: content area holding three same-size children, all but the
        # active one hidden. Right: narrow vertical tab strip switching them.
        # The active tab is highlighted by the theme's checked bg_color.
        # ---------------------------------------------------------------------
        - obj:
            id: main_stack_card
            width: 100%
            flex_grow: 1
            styles: control
            radius: $radius
            # clip_corner makes the card clip its children to its own rounded
            # shape. That is what gives the tab column rounded corners on the
            # right only: the column itself is drawn with radius 0, its left
            # edge stays flush against the content area.
            clip_corner: true
            border_width: 1
            border_color: $border_card
            pad_all: 0
            scrollbar_mode: "off"
            scrollable: false
            clickable: false
            layout:
              type: flex
              flex_flow: row
              pad_column: 0
            widgets:

              # ---------------- content area (no layout: children stack) -----
              # No padding here: the children are height/width 100%, and any
              # padding would make them overflow and turn this into a scrollable
              # container. Tapping a button near the bottom would then scroll it
              # into view and push the title out of the card. Each tab child
              # carries its own pad_all instead, and scrolling is off entirely.
              - obj:
                  id: main_stack_content
                  flex_grow: 1
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  clickable: false
                  widgets:
                    # ===== TAB: Heizung (climate.eve_thermo_20ebp1701) =====
                    # Layout: title row, then one free-form area: the dial
                    # centred, -/+ inside its bottom gap, and the power toggle
                    # as an icon button in the bottom-right corner. The arc
                    # carries the target temperature; its scale is degrees x2
                    # because LVGL arcs are integer-valued -- the same
                    # convention the heating detail page uses.
                    - obj:
                        id: main_stack_heat
                        width: 100%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 14
                        scrollbar_mode: "off"
                        scrollable: false
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: space_between
                          pad_row: 10
                        widgets:

                          # Title
                          - obj:
                              width: SIZE_CONTENT
                              height: 34
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                                flex_align_track: center
                                pad_column: 8
                              widgets:
                                - label:
                                    text_font: icon_font_small
                                    text_color: $accent_orange
                                    text: $fire
                                - label:
                                    id: main_heat_title_label
                                    text: "Heizung"
                                    text_font: roboto17_font
                                    text_color: $text_primary

                          # Big dial: arc filling the middle, current temp on
                          # top, target in the center, -/+ inside the bottom
                          # gap of the ring (start 135 / end 45 leaves the
                          # bottom quadrant free). No layout on this wrapper:
                          # the dial centres itself and the power button sits
                          # in the bottom-right corner. The box is resized by
                          # stack_arc_resize as the notification row grows and
                          # shrinks; the defaults below are the boot geometry
                          # (empty row visible, 300px).
                          - obj:
                              width: 100%
                              flex_grow: 1
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollbar_mode: "off"
                              scrollable: false
                              clickable: false
                              widgets:
                                - obj:
                                    id: main_heat_arc_box
                                    align: center
                                    width: 300
                                    height: 300
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    scrollbar_mode: "off"
                                    scrollable: false
                                    clickable: false
                                    widgets:
                                      - arc:
                                          id: main_heat_arc
                                          align: center
                                          width: 100%
                                          height: 100%
                                          # Scale is degrees x2; the Eve Thermo
                                          # accepts 10..30 degC (min/max_temp).
                                          min_value: 20
                                          max_value: 60
                                          value: 40
                                          start_angle: 135
                                          end_angle: 45
                                          arc_width: 14
                                          arc_color: $control_inner_color
                                          adjustable: true
                                          clickable: true
                                          indicator:
                                            arc_color: $accent_orange
                                            arc_width: 14
                                          knob:
                                            bg_color: $accent_orange
                                          # Fires on user interaction only:
                                          # lv_arc_set_value (what the sensor
                                          # update calls) sends no event, so
                                          # this cannot feed back on itself.
                                          on_value:
                                            - lambda: |-
                                                id(heat_main_pending_target) = (float) x / 2.0f;
                                                id(heat_main_editing) = true;
                                                id(heat_main_hold_deadline) = millis() + 15000;
                                            - script.execute: heat_main_apply_local
                                            - script.execute: heat_main_send_target
                                      - label:
                                          id: main_heat_current_label
                                          align: center
                                          y: -85
                                          text: "Ist --.-°"
                                          text_font: roboto15_font
                                          text_color: $text_tertiary
                                      - label:
                                          id: main_heat_target_label
                                          align: center
                                          y: 2
                                          text: "--.-°"
                                          text_font: roboto44_font
                                          text_color: $text_primary
                                      - button:
                                          id: main_heat_down_button
                                          align: bottom_mid
                                          x: -38
                                          y: -2
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          border_width: 1
                                          border_color: $border_circle
                                          widgets:
                                            - label:
                                                align: center
                                                text: "-"
                                                text_font: roboto28_font
                                                text_color: $text_primary
                                          on_click:
                                            - lambda: |-
                                                float base = id(heat_main_pending_target);
                                                if (isnan(base)) {
                                                  base = (id(heating_main_target_temp).has_state() &&
                                                          !isnan(id(heating_main_target_temp).state))
                                                         ? id(heating_main_target_temp).state : 20.0f;
                                                }
                                                float v = base - 0.5f;
                                                if (v < 10.0f) v = 10.0f;
                                                if (v > 30.0f) v = 30.0f;
                                                id(heat_main_pending_target) = v;
                                                id(heat_main_editing) = true;
                                                id(heat_main_hold_deadline) = millis() + 15000;
                                            - script.execute: heat_main_apply_local
                                            - script.execute: heat_main_send_target
                                      - button:
                                          id: main_heat_up_button
                                          align: bottom_mid
                                          x: 38
                                          y: -2
                                          width: 56
                                          height: 56
                                          pad_all: 0
                                          radius: 28
                                          bg_color: $control_inner_color
                                          border_width: 1
                                          border_color: $border_circle
                                          widgets:
                                            - label:
                                                align: center
                                                text: "+"
                                                text_font: roboto28_font
                                                text_color: $text_primary
                                          on_click:
                                            - lambda: |-
                                                float base = id(heat_main_pending_target);
                                                if (isnan(base)) {
                                                  base = (id(heating_main_target_temp).has_state() &&
                                                          !isnan(id(heating_main_target_temp).state))
                                                         ? id(heating_main_target_temp).state : 20.0f;
                                                }
                                                float v = base + 0.5f;
                                                if (v < 10.0f) v = 10.0f;
                                                if (v > 30.0f) v = 30.0f;
                                                id(heat_main_pending_target) = v;
                                                id(heat_main_editing) = true;
                                                id(heat_main_hold_deadline) = millis() + 15000;
                                            - script.execute: heat_main_apply_local
                                            - script.execute: heat_main_send_target

                                # Power toggle: icon-only, bottom-right corner
                                # of the card (green when heating is on).
                                - button:
                                    id: main_heat_power_button
                                    align: bottom_right
                                    width: 56
                                    height: 56
                                    pad_all: 0
                                    radius: 28
                                    bg_color: $control_inner_color
                                    text_color: $text_secondary
                                    border_width: 1
                                    border_color: $border_circle
                                    checked:
                                      bg_color: $tint_green
                                      text_color: $accent_green
                                      border_color: $accent_green
                                    checkable: true
                                    widgets:
                                      - label:
