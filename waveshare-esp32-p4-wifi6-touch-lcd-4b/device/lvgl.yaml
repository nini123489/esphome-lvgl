        flex_flow: column
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_color: $page_bg_color
      bg_opa: cover

      widgets:
        - obj:
            id: printer_lab_root
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              # Back button
              - button:
                  id: printer_lab_back_button
                  width: 90px
                  height: 90px
                  x: 8
                  y: 51
                  styles: control
                  widgets:
                    - label:
                        text_font: $icon_font
                        align: center
                        text: $chevron_left
                  on_click:
                    - script.execute:
                        id: nav_to_page
                        page: "Übersicht"

              # Page title
              - label:
                  id: printer_lab_title
                  text: "3D-Drucker"
                  text_font: roboto19_font
                  text_color: $text_primary
                  align: top_mid
                  y: 65

              # Print status (e.g. "Druckt", "Bereit", "Pausiert", "Offline")
              - label:
                  id: printer_lab_status_label
                  text: "Offline"
                  text_font: roboto19_font
                  text_color: $accent_orange
                  align: center
                  y: -150

              # Large print progress percentage (hidden when offline)
              - obj:
                  id: printer_lab_progress_row
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: center
                  y: -60
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: end
                  widgets:
                    - label:
                        id: printer_lab_progress_label
                        text: "--"
                        text_font: roboto48_font
                        text_color: $text_primary
                    - label:
                        text: "%"
                        text_font: roboto19_font
                        text_color: $text_primary

              # Power draw (Watt) (hidden when offline)
              - obj:
                  id: printer_lab_power_row
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: center
                  y: 30
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  hidden: true
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: center
                    flex_align_track: center
                  widgets:
                    - label:
                        id: printer_lab_power_label
                        text: "--"
                        text_font: roboto19_font
                        text_color: $text_tertiary
                    - label:
                        text: " W"
                        text_font: roboto19_font
                        text_color: $text_tertiary

              # On/Off toggle button
              # If the printer is currently printing (power state ON and
              # progress between 0 and 100), tapping shows a confirmation
              # modal instead of toggling immediately.
              - button:
                  id: printer_lab_power_button
                  width: 220px
                  height: 100px
                  align: bottom_mid
                  y: -60
                  checkable: true
                  styles: control
                  widgets:
                    - label:
                        id: printer_lab_power_button_label
                        text: "An / Aus"
                        text_font: roboto19_font
                        align: center
                  on_click:
                    - if:
                        condition:
                          lambda: |-
                            if (!id(printer_power_state).state) return false;
                            if (!id(printer_progress_value).has_state()) return false;
                            float p = id(printer_progress_value).state;
                            return p > 0.0f && p < 100.0f;
                        then:
                          - lvgl.widget.update:
                              id: printer_confirm_modal
                              hidden: false
                          - lvgl.widget.update:
                              id: printer_lab_power_button
                              state:
                                checked: true
                        else:
                          - homeassistant.service:
                              service: switch.toggle
                              data:
                                entity_id: switch.3d_drucker

              # Confirmation modal — shown only when the user tries to turn
              # off the printer mid-print. Defined last so it renders on top.
              - obj:
                  id: printer_confirm_modal
                  width: 100%
                  height: 100%
                  align: center
                  bg_color: 0x000000
                  bg_opa: 70%
                  border_width: 0
                  pad_all: 0
                  hidden: true
                  clickable: true
                  widgets:
                    - obj:
                        width: 500px
                        height: 280px
                        align: center
                        bg_color: $control_inner_color
                        bg_opa: cover
                        border_width: 2
                        border_color: $accent_orange
                        radius: 16
                        pad_all: 20
                        widgets:
                          - label:
                              text: "Drucker laeuft"
                              text_font: roboto19_font
                              text_color: $accent_orange
                              align: top_mid
                          - label:
                              text: "Wirklich ausschalten?"
                              text_font: roboto19_font
                              text_color: $text_primary
                              align: center
                              y: -20
                          - button:
                              width: 200px
                              height: 90px
                              align: bottom_left
                              styles: control
                              widgets:
                                - label:
                                    text: "Abbrechen"
                                    text_font: roboto19_font
                                    align: center
                              on_click:
                                - lvgl.widget.update:
                                    id: printer_confirm_modal
                                    hidden: true
                          - button:
                              width: 200px
                              height: 90px
                              align: bottom_right
                              styles: control
                              bg_color: 0xCC2A2A
                              widgets:
                                - label:
                                    text: "Ausschalten"
                                    text_font: roboto19_font
                                    text_color: $text_primary
                                    align: center
                              on_click:
                                - homeassistant.service:
                                    service: switch.toggle
                                    data:
                                      entity_id: switch.3d_drucker
                                - lvgl.widget.update:
                                    id: printer_confirm_modal
                                    hidden: true

