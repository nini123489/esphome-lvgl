                                                service: fan.toggle
                                                data:
                                                  entity_id: fan.dmaker_de_454884949_p33_s_2_fan
                                      # Cycles the two presets the entity
                                      # offers; the icon (leaf = natural,
                                      # fan = direct) is set by the
                                      # fan_main_preset sensor. Spelling must
                                      # match HA byte for byte.
