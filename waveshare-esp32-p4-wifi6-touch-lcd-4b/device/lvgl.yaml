# =============================================================================
# LVGL TOUCHSCREEN INTERFACE
# =============================================================================
# This file defines the graphical user interface (GUI) for the ESP32 touchscreen
# display. It creates buttons that control smart home devices through Home Assistant.
#
# HOW IT WORKS:
# - Each button sends a command to Home Assistant when pressed (on_press/on_click)
# - Buttons receive state updates from sensors defined in sensors.yaml
# - When a sensor changes, the button's appearance updates (checked/unchecked)
#
# KEY CONCEPTS:
# - "id:" is a unique name used to reference this element from other files
# - "entity_id:" refers to a device/entity in Home Assistant
# - "checkable: true" means the button shows on/off state visually
# - "$variable" values (like $button_width) are defined in template.yaml
# - Sensors in sensors.yaml watch Home Assistant and update button states
# =============================================================================

# =============================================================================
# NOTIFICATIONS — state + scripts
# =============================================================================
# - 2 fixed string slots rendered inline on the dashboard (slot 0 = newest).
# - notification_count tracks how many slots are active (0..2).
# - HA calls api action "notify" (device.yaml) -> script notif_push.
# - Tapping an entry -> script notif_dismiss with the slot index.
# - notif_render re-syncs the two rows, the "Keine Mitteilungen" placeholder,
#   and the collapse state of the whole row (see collapse_notify in
#   addon/ha_controls.yaml).
# =============================================================================

globals:
  - id: notification_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: notif_text_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_1
    type: std::string
    restore_value: false
    initial_value: '""'
  # Per-slot wall-clock stamp ("HH:MM") captured when the entry was pushed.
  - id: notif_time_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_time_1
    type: std::string
    restore_value: false
    initial_value: '""'
  # Per-slot expire timestamps (seconds since boot, 0 = never expire).
  - id: notif_expire_0
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_1
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Info-Box view toggle: false = energy flow diagram visible (default), true = 2x2 grid view visible
  - id: info_view_flow_hidden
    type: bool
    restore_value: false
    initial_value: 'false'
  # Wall-clock millis of the last touch event. The 15s interval below compares
  # against this to drive the idle revert (when the matching HA switch is on).
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Heating local-echo state (Übersicht card, climate.eve_thermo_20ebp1701).
  # pending_target is the locally authoritative setpoint: buttons/arc read and
  # write only this, the HA sensor merely seeds it while not editing.
  - id: heat_main_pending_target
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: heat_main_editing
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: heat_main_hold_deadline
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Same trio for the heating detail page (climate.office_radiator_thermostat).
  - id: heating_lab_pending_target
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: heating_lab_editing
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: heating_lab_hold_deadline
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Same trio for the fan speed arc (fan.dmaker_de_454884949_p33_s_2_fan).
  - id: fan_main_pending_pct
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: fan_main_editing
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fan_main_hold_deadline
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Light tab (light.h6022): one shared editing guard for all four sliders,
  # plus a pending value per control. Sliders send on_release (one call), so
  # no debounce script is needed here.
  - id: light_main_editing
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: light_main_hold_deadline
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: light_pending_bri
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: light_pending_hue
    type: float
    restore_value: false
    initial_value: '0'
  - id: light_pending_sat
    type: float
    restore_value: false
    initial_value: '100'
  - id: light_pending_ct
    type: float
    restore_value: false
    initial_value: '4000'
  # Calendar tab: raw event lines ("calkey|zeit|titel") pushed by the HA
  # automation via the calendar_events api action, plus the active filter
  # ("" = all calendars, otherwise a calkey like "plan").
  - id: cal_events
    type: std::vector<std::string>
    restore_value: false
  - id: cal_filter
    type: std::string
    restore_value: false
    initial_value: '""'

script:
  # Central page-navigation entry point. Takes a HA-facing label and routes to
  # the matching LVGL page, while keeping the "Aktive Seite" select in sync via
  # publish_state (avoids triggering the on_value callback again).
  - id: nav_to_page
    # single = ignore concurrent calls; prevents recursion via the
    # active_page_select on_value callback (which also calls this script).
    mode: single
    parameters:
      page: string
    then:
      - lambda: 'id(active_page_select).publish_state(page);'
      - if:
          condition:
            lambda: 'return page == "Übersicht";'
          then:
            - lvgl.page.show: main_page
      - if:
          condition:
            lambda: 'return page == "Szenen";'
          then:
            - lvgl.page.show: scenes_page
      - if:
          condition:
            lambda: 'return page == "Heizung";'
          then:
            - lvgl.page.show: heating_lab_page
      - if:
          condition:
            lambda: 'return page == "Drucker";'
          then:
            - lvgl.page.show: printer_lab_page
      - if:
          condition:
            lambda: 'return page == "Staubi-Saugi";'
          then:
            - lvgl.page.show: vacuum_page
      - if:
          condition:
            lambda: 'return page == "Wetter";'
          then:
            - lvgl.page.show: weather_page
      - if:
          condition:
            lambda: 'return page == "Energie";'
          then:
            - lvgl.page.show: energy_page
      - if:
          condition:
            lambda: 'return page == "Mehr";'
          then:
            - lvgl.page.show: more_page

  # Read the HA "Default-Seite" select and navigate there. Called from boot,
  # idle revert, and the backlight off handler.
  - id: nav_to_default_page
    then:
      - script.execute:
          id: nav_to_page
          page: !lambda 'return id(default_page_select).current_option().c_str();'

  - id: notif_push
    mode: queued
    parameters:
      title: string
      message: string
      expire_hours: float
    then:
      - lambda: |-
          // Shift slot 0 -> 1; the previous slot 1 is dropped.
          id(notif_text_1)   = id(notif_text_0);
          id(notif_time_1)   = id(notif_time_0);
          id(notif_expire_1) = id(notif_expire_0);
          // Compose new entry into slot 0.
          std::string combined = title;
          if (!message.empty()) {
            if (!combined.empty()) combined += ": ";
            combined += message;
          }
          id(notif_text_0) = combined;
          // Wall-clock stamp shown right-aligned in the row. Empty before sync.
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            char tb[8];
            snprintf(tb, sizeof(tb), "%02d:%02d", now.hour, now.minute);
            id(notif_time_0) = tb;
          } else {
            id(notif_time_0) = "";
          }
          // Compute expire timestamp. 0 = never expire.
          if (expire_hours > 0.0f) {
            uint32_t now_s = (uint32_t)(millis() / 1000ULL);
            id(notif_expire_0) = now_s + (uint32_t)(expire_hours * 3600.0f);
          } else {
            id(notif_expire_0) = 0;
          }
          if (id(notification_count) < 2) {
            id(notification_count) = id(notification_count) + 1;
          }
      - script.execute: notif_render
      # Wake the display (no-op if already on) so the user sees the new entry.
      # The row is inline on the dashboard, so there is no panel to open.
      - light.turn_on:
          id: backlight

  - id: notif_dismiss
    mode: queued
    parameters:
      index: int
    then:
      - lambda: |-
          // Removing slot 0 pulls slot 1 up; slot 1 is always cleared.
          if (index <= 0) {
            id(notif_text_0)   = id(notif_text_1);
            id(notif_time_0)   = id(notif_time_1);
            id(notif_expire_0) = id(notif_expire_1);
          }
          id(notif_text_1)   = "";
          id(notif_time_1)   = "";
          id(notif_expire_1) = 0;
          if (id(notification_count) > 0) {
            id(notification_count) = id(notification_count) - 1;
          }
      - script.execute: notif_render

  # Re-syncs both inline rows, the placeholder, and the collapse state.
  # Called by push/dismiss/expiry and by the collapse_notify switch.
  - id: notif_render
    mode: restart
    then:
      # Slot 0
      - lvgl.label.update:
          id: main_notif_text_0
          text: !lambda 'return id(notif_text_0);'
      - lvgl.label.update:
          id: main_notif_time_0
          text: !lambda 'return id(notif_time_0);'
      - lvgl.widget.update:
          id: main_notif_slot_0
          hidden: !lambda 'return id(notification_count) < 1;'
      # Slot 1
      - lvgl.label.update:
          id: main_notif_text_1
          text: !lambda 'return id(notif_text_1);'
      - lvgl.label.update:
          id: main_notif_time_1
          text: !lambda 'return id(notif_time_1);'
      - lvgl.widget.update:
          id: main_notif_slot_1
          hidden: !lambda 'return id(notification_count) < 2;'
      # Placeholder text, only while the row is empty
      - lvgl.widget.update:
          id: main_notif_empty_label
          hidden: !lambda 'return id(notification_count) > 0;'
      # Collapse the whole row when empty and the user asked for it. Flex skips
      # hidden children, so the freed height goes to the stack card by itself.
      - lvgl.widget.update:
          id: main_notif_box
          hidden: !lambda 'return id(notification_count) == 0 && id(collapse_notify).state;'
      # The stack-card arcs grow into the freed height (and shrink back).
      - script.execute: stack_arc_resize

  # Periodic check: drop slots whose expire timestamp has passed.
  # In-place two-pointer compaction over text + time + expire arrays.
  - id: notif_check_expired
    mode: restart
    then:
      - lambda: |-
          uint32_t now_s = (uint32_t)(millis() / 1000ULL);
          std::string texts[2] = { id(notif_text_0), id(notif_text_1) };
          std::string times[2] = { id(notif_time_0), id(notif_time_1) };
          uint32_t exps[2]     = { id(notif_expire_0), id(notif_expire_1) };
          int count = id(notification_count);
          int write = 0;
          bool changed = false;
          for (int read = 0; read < count; read++) {
            if (exps[read] == 0 || now_s < exps[read]) {
              if (write != read) {
                texts[write] = texts[read];
                times[write] = times[read];
                exps[write]  = exps[read];
              }
              write++;
            } else {
              changed = true;
            }
          }
          for (int i = write; i < 2; i++) {
            texts[i] = "";
            times[i] = "";
            exps[i]  = 0;
          }
          if (changed) {
            id(notif_text_0) = texts[0]; id(notif_time_0) = times[0]; id(notif_expire_0) = exps[0];
            id(notif_text_1) = texts[1]; id(notif_time_1) = times[1]; id(notif_expire_1) = exps[1];
            id(notification_count) = write;
            id(notif_render).execute();
          }

  # Push the locally pending target onto the Übersicht heating widgets.
  # Single source of truth for the local echo, shared by -, + and the arc.
  - id: heat_main_apply_local
    then:
      - lvgl.label.update:
          id: main_heat_target_label
          text:
            format: "%.1f°"
            args: [ 'id(heat_main_pending_target)' ]
      # Raw call, NOT lvgl.arc.update: the declarative update action fires
      # lv_update_event, which ESPHome also routes into the arc's on_value --
      # that would re-trigger the send pipeline from a programmatic update.
      - lambda: |-
          int v = (int)roundf(id(heat_main_pending_target) * 2.0f);
          if (v < 20) v = 20;
          if (v > 60) v = 60;
          lv_arc_set_value(id(main_heat_arc), v);

  # Debounced send: restarted on every local edit, so exactly one
  # climate.set_temperature call goes out 2s after the last change.
  - id: heat_main_send_target
    mode: restart
    then:
      - delay: 2s
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.eve_thermo_20ebp1701
            hvac_mode: heat
          data_template:
            temperature: "{{ temp }}"
          variables:
            temp: !lambda 'return id(heat_main_pending_target);'

  # Same local echo for the heating detail page. Drives the whole gauge
  # (label + track/dot/delta/mask arcs) so it stays consistent while editing.
  - id: heating_lab_apply_local
    then:
      - lvgl.label.update:
          id: heating_lab_target_label
          text:
            format: "%.1f°C"
            args: [ 'id(heating_lab_pending_target)' ]
      - lvgl.arc.update:
          id: heating_track_arc
          value: !lambda return (int)roundf(id(heating_lab_pending_target) * 2.0f);
      # Raw call: lvgl.arc.update would fire lv_update_event into this arc's
      # on_value and re-trigger its send pipeline (see heat_main_apply_local).
      - lambda: |-
          lv_arc_set_value(id(heating_target_dot_arc),
                           (int)roundf(id(heating_lab_pending_target) * 2.0f));
      - lvgl.arc.update:
          id: heating_delta_arc
          value: !lambda |-
            float tgt = id(heating_lab_pending_target);
            float cur = tgt;
            if (id(heating_current_temperature).has_state() &&
                !isnan(id(heating_current_temperature).state)) {
              cur = id(heating_current_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v > tgt_v ? cur_v : tgt_v;
      - lvgl.arc.update:
          id: heating_mask_arc
          value: !lambda |-
            float tgt = id(heating_lab_pending_target);
            float cur = tgt;
            if (id(heating_current_temperature).has_state() &&
                !isnan(id(heating_current_temperature).state)) {
              cur = id(heating_current_temperature).state;
            }
            int cur_v = (int)roundf(cur * 2.0f);
            int tgt_v = (int)roundf(tgt * 2.0f);
            return cur_v < tgt_v ? cur_v : tgt_v;

  - id: heating_lab_send_target
    mode: restart
    then:
      - delay: 2s
      - homeassistant.service:
          service: climate.set_temperature
          data:
            entity_id: climate.office_radiator_thermostat
            hvac_mode: heat
          data_template:
            temperature: "{{ temp }}"
          variables:
            temp: !lambda 'return id(heating_lab_pending_target);'

  # Fan speed local echo + debounced send, same mechanism as the heating arc.
  - id: fan_main_apply_local
    then:
      - lvgl.label.update:
          id: main_fan_speed_label
          text:
            format: "%.0f%%"
            args: [ 'id(fan_main_pending_pct)' ]
      # Raw call for the same reason as in heat_main_apply_local.
      - lambda: |-
          int v = (int)roundf(id(fan_main_pending_pct));
          if (v < 1) v = 1;
          if (v > 100) v = 100;
          lv_arc_set_value(id(main_fan_arc), v);

  - id: fan_main_send_pct
    mode: restart
    then:
      - delay: 2s
      - homeassistant.service:
          service: fan.set_percentage
          data:
            entity_id: fan.dmaker_de_454884949_p33_s_2_fan
          data_template:
            percentage: "{{ pct }}"
          variables:
            pct: !lambda 'return (int)roundf(id(fan_main_pending_pct));'

  # Rebuild the calendar list rows from cal_events, honoring cal_filter.
  # One raw-LVGL lambda instead of per-row declarative updates: the six rows
  # are driven from arrays, the per-calendar dot colors are style calls, and
  # rows beyond the match count are hidden.
  - id: cal_render
    then:
      - lambda: |-
          lv_obj_t* rows[6]   = { id(cal_row_0), id(cal_row_1), id(cal_row_2),
                                  id(cal_row_3), id(cal_row_4), id(cal_row_5) };
          lv_obj_t* dots[6]   = { id(cal_dot_0), id(cal_dot_1), id(cal_dot_2),
                                  id(cal_dot_3), id(cal_dot_4), id(cal_dot_5) };
          lv_obj_t* times[6]  = { id(cal_time_0), id(cal_time_1), id(cal_time_2),
                                  id(cal_time_3), id(cal_time_4), id(cal_time_5) };
          lv_obj_t* titles[6] = { id(cal_title_0), id(cal_title_1), id(cal_title_2),
                                  id(cal_title_3), id(cal_title_4), id(cal_title_5) };
          int shown = 0;
          for (const auto &line : id(cal_events)) {
            if (shown >= 6) break;
            size_t p1 = line.find('|');
            if (p1 == std::string::npos) continue;
            size_t p2 = line.find('|', p1 + 1);
            if (p2 == std::string::npos) continue;
            std::string cal   = line.substr(0, p1);
            std::string zeit  = line.substr(p1 + 1, p2 - p1 - 1);
            std::string titel = line.substr(p2 + 1);
            if (!id(cal_filter).empty() && cal != id(cal_filter)) continue;
            lv_color_t c = lv_color_hex(0xE0B04E);            // termine (amber)
            if (cal == "travel")   c = lv_color_hex(0x4A9BD1); // blue
            if (cal == "pruefung") c = lv_color_hex(0xD35B5B); // red
            if (cal == "plan")     c = lv_color_hex(0x63B08C); // green
            lv_obj_set_style_bg_color(dots[shown], c, LV_PART_MAIN);
            lv_label_set_text(times[shown], zeit.c_str());
            lv_label_set_text(titles[shown], titel.c_str());
            lv_obj_clear_flag(rows[shown], LV_OBJ_FLAG_HIDDEN);
            shown++;
          }
          for (int i = shown; i < 6; i++) {
            lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
          }
          if (shown == 0) {
            lv_obj_clear_flag(id(cal_empty_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(cal_empty_label), LV_OBJ_FLAG_HIDDEN);
          }

  # Calendar filter chips, radio style like stack_show_tab: set the filter,
  # highlight the matching chip, re-render the list.
  - id: cal_set_filter
    parameters:
      filter: string
    then:
      - lambda: 'id(cal_filter) = filter;'
      - lvgl.widget.update:
          id: cal_chip_all
          state:
            checked: !lambda 'return filter == "";'
      - lvgl.widget.update:
          id: cal_chip_travel
          state:
            checked: !lambda 'return filter == "travel";'
      - lvgl.widget.update:
          id: cal_chip_termine
          state:
            checked: !lambda 'return filter == "termine";'
      - lvgl.widget.update:
          id: cal_chip_pruefung
          state:
            checked: !lambda 'return filter == "pruefung";'
      - lvgl.widget.update:
          id: cal_chip_plan
          state:
            checked: !lambda 'return filter == "plan";'
      - script.execute: cal_render

  # Central stack-tab switcher: shows the chosen tab, updates the tab-strip
  # checked states and mirrors the choice into the HA-facing "Stack-Widget"
  # select (publish_state fires the select's on_value, which calls this
  # script again -- mode: single swallows that recursion, same trick as
  # nav_to_page). Called by the four tab buttons and by the select.
  - id: stack_show_tab
    mode: single
    parameters:
      tab: string
    then:
      - lambda: 'id(stack_tab_select).publish_state(tab);'
      - lvgl.widget.update:
          id: main_stack_heat
          hidden: !lambda 'return tab != "Heizung";'
      - lvgl.widget.update:
          id: main_stack_fan
          hidden: !lambda 'return tab != "Ventilator";'
      - lvgl.widget.update:
          id: main_stack_cal
          hidden: !lambda 'return tab != "Kalender";'
      - lvgl.widget.update:
          id: main_stack_light
          hidden: !lambda 'return tab != "Lampe";'
      - lvgl.widget.update:
          id: main_stack_scenes
          hidden: !lambda 'return tab != "Szenen";'
      - lvgl.widget.update:
          id: main_tab_heat_button
          state:
            checked: !lambda 'return tab == "Heizung";'
      - lvgl.widget.update:
          id: main_tab_fan_button
          state:
            checked: !lambda 'return tab == "Ventilator";'
      - lvgl.widget.update:
          id: main_tab_cal_button
          state:
            checked: !lambda 'return tab == "Kalender";'
      - lvgl.widget.update:
          id: main_tab_light_button
          state:
            checked: !lambda 'return tab == "Lampe";'
      - lvgl.widget.update:
          id: main_tab_scenes_button
          state:
            checked: !lambda 'return tab == "Szenen";'

  # Lampe tab: swap between the manual control body and the automation panel.
  # "Automation running" = HA master switch on AND manual-override lock off.
  # The lock matters: while it is set the automation deliberately keeps its
  # hands off the lamp, so the sliders belong on screen even though the master
  # switch still reads "on".
  # All three binary sensors call this script and it re-reads all of them, so
  # the order in which HA delivers the initial states does not matter.
  - id: light_auto_render
    mode: single
    then:
      - lvgl.widget.update:
          id: light_auto_panel
          hidden: !lambda 'return !(id(light_auto_enabled).state && !id(light_auto_paused).state);'
      - lvgl.widget.update:
          id: light_manual_body
          hidden: !lambda 'return (id(light_auto_enabled).state && !id(light_auto_paused).state);'
      - lvgl.widget.update:
          id: light_auto_on_box
          hidden: !lambda 'return (id(light_auto_enabled).state && !id(light_auto_paused).state);'
      - lvgl.label.update:
          id: light_auto_status_label
          text: !lambda |-
            if (id(light_night_mode).state) return std::string("Nachtmodus aktiv");
            return std::string("Lichtautomatik aktiv");
      - lvgl.label.update:
          id: light_auto_night_label
          text: !lambda |-
            if (id(light_night_mode).state) return std::string("Nachtmodus beenden");
            return std::string("Nachtmodus aktivieren");
      - lvgl.widget.update:
          id: light_auto_night_button
          state:
            checked: !lambda 'return id(light_night_mode).state;'

  # Resize the stack-card arcs to the space the notification row leaves over.
  # The row is SIZE_CONTENT (one 46px line per notification), so there are
  # four states: row collapsed 340px, empty placeholder 300px, one
  # notification 280px, two notifications 228px. The top label rides at
  # -(2/7) of the box size. Called from notif_render, which owns the row's
  # hidden state.
  - id: stack_arc_resize
    then:
      - lvgl.widget.update:
          id: main_heat_arc_box
          width: !lambda |-
            if (id(notification_count) >= 2) return 228;
            if (id(notification_count) == 1) return 280;
            return id(collapse_notify).state ? 340 : 300;
          height: !lambda |-
            if (id(notification_count) >= 2) return 228;
            if (id(notification_count) == 1) return 280;
            return id(collapse_notify).state ? 340 : 300;
      - lvgl.widget.update:
          id: main_fan_arc_box
          width: !lambda |-
            if (id(notification_count) >= 2) return 228;
            if (id(notification_count) == 1) return 280;
            return id(collapse_notify).state ? 340 : 300;
          height: !lambda |-
            if (id(notification_count) >= 2) return 228;
            if (id(notification_count) == 1) return 280;
            return id(collapse_notify).state ? 340 : 300;
      - lvgl.label.update:
          id: main_heat_current_label
          y: !lambda |-
            int s;
            if (id(notification_count) >= 2) s = 228;
            else if (id(notification_count) == 1) s = 280;
            else s = id(collapse_notify).state ? 340 : 300;
            return -(s * 2) / 7;
      - lvgl.label.update:
          id: main_fan_mode_label
          y: !lambda |-
            int s;
            if (id(notification_count) >= 2) s = 228;
            else if (id(notification_count) == 1) s = 280;
            else s = id(collapse_notify).state ? 340 : 300;
            return -(s * 2) / 7;

interval:
  - interval: 30s
    then:
      - script.execute: notif_check_expired

  # Idle-revert check. Compares millis() against last_activity_ms (touched by
  # the touchscreen on_touch handler in device.yaml) and reverts to the default
  # page when the HA-configured threshold is exceeded. Skipped while the
  # HA-side revert switch is off.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(idle_revert_enabled).state) return false;
              uint32_t threshold = (uint32_t)(id(idle_timeout_minutes).state * 60.0f * 1000.0f);
              return ((uint32_t) millis() - id(last_activity_ms)) >= threshold;
          then:
            - script.execute: nav_to_default_page

lvgl:
  buffer_size: 100%
  byte_order: little_endian
  displays: my_display
  touchscreens: my_touchscreen
  # Multi-stop gradients for the light tab's picker sliders. Positions are
  # percentages, direction VER = first stop at the top. The sliders show the
  # gradient on their main part with a transparent indicator, so the full
  # ramp stays visible and the knob marks the position.
  gradients:
    # Full hue circle for the Farbton slider (value 0..360, max at the top):
    # red at both ends, running backwards so hue increases upwards.
    - id: hue_grad
      direction: VER
      stops:
        - color: 0xFF0000
          position: 0%
        - color: 0xFF00FF
          position: 17%
        - color: 0x0000FF
          position: 33%
        - color: 0x00FFFF
          position: 50%
        - color: 0x00FF00
          position: 67%
        - color: 0xFFFF00
          position: 83%
        - color: 0xFF0000
          position: 100%
    # Saturation: vivid at the top (100), white at the bottom (0). Static
    # red-ish approximation of the currently selected hue.
    - id: sat_grad
      direction: VER
      stops:
        - color: 0xFF4030
          position: 0%
        - color: 0xFFFFFF
          position: 100%
    # Color temperature: warm at the top like the HA card. The slider value
    # is inverted when sending (kelvin = 8535 - x) so warm stays on top even
    # though LVGL puts the max value at the top.
    - id: ct_grad
      direction: VER
      stops:
        - color: 0xFF6A00
          position: 0%
        - color: 0xFFC98A
          position: 50%
        - color: 0xFAF6EF
          position: 100%
  top_layer:
    # The former global status bar (clock, temperatures, battery, notification
    # bell) lived here and forced every page to reserve 51px of top padding.
    # Those values now live in the dashboard header + status line, and each
    # sub-page owns its full height, so only the voice overlay remains.
    widgets:

      # =========================================================================
      # VOICE ASSISTANT OVERLAY (full-screen, top_layer)
      # =========================================================================
      # Shown automatically by voice_assistant events in addon/audio.yaml.
      # Pulsing colored border driven by an interval in audio.yaml (cycles
      # through 4 colors every 400ms while voice_active=true).
      # Three labels: state (top), recognized text (middle), response (bottom).
      # Clickable obj so taps don't fall through to widgets behind.
      # =========================================================================
      - obj:
          id: voice_overlay
          width: 100%
          height: 100%
          align: center
          bg_color: 0x000000
          bg_opa: 75%
          border_width: 8
          border_color: $accent_orange
          radius: 0
          pad_all: 32
          hidden: true
          clickable: true
          widgets:
            - label:
                id: voice_overlay_state
                text: "Höre zu…"
                text_font: roboto36_font
                text_color: $text_primary
                align: top_mid
                y: 60
            - label:
                id: voice_overlay_stt
                text: ""
                text_font: roboto19_font
                text_color: $text_tertiary
                align: center
                y: -20
                text_align: center
                long_mode: wrap
                width: 600px
            - label:
                id: voice_overlay_tts
                text: ""
                text_font: roboto19_font
                text_color: $text_primary
                align: center
                y: 80
                text_align: center
                long_mode: wrap
                width: 600px

  pages:
    # =========================================================================
    # DASHBOARD — the overview page
    # =========================================================================
    # Vertical stack, top to bottom (heights sum to the 690px content box):
    #   header 84 + status 44 + notifications SIZE_CONTENT + stack flex +
    #   quick 96, with 10px row gaps.
    # The stack card is the only flex_grow child, so whatever height the
    # notification row gives up (fewer rows, or collapsed entirely — see
    # notif_render) is donated to the stack card; stack_arc_resize rescales
    # the dials accordingly.
    #
    # NOTE: theme/button.yaml gives every button 225x210 with 18px padding, so
    # every button below sets width/height/pad_all explicitly.
