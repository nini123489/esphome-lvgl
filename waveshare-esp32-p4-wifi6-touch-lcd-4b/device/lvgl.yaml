    - id: main_page
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_color: $page_bg_color
      bg_opa: cover
      pad_top: 14
      pad_bottom: 16
      pad_left: 20
      pad_right: 20
      layout:
        type: flex
        flex_flow: column
        pad_row: 10
      widgets:

        # ---------------------------------------------------------------------
        # HEADER — large clock left, small date right (driven by time_update)
        # ---------------------------------------------------------------------
        - obj:
            id: main_header
            width: 100%
            height: 84
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "off"
            clickable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_between
              flex_align_cross: center
              flex_align_track: center
            widgets:
              - label:
                  id: main_clock_label
                  text: "--:--"
                  text_font: roboto44_font
                  text_color: $text_primary
              - label:
                  id: main_date_label
                  text: "-"
                  text_font: roboto19_font
                  text_color: $text_tertiary

        # ---------------------------------------------------------------------
        # STATUS LINE — passive info row, no frame, muted colors.
