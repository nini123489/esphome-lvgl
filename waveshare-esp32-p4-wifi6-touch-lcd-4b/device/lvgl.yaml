              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              pad_column: 10
            widgets:
              - label:
                  text_font: icon_font_small
                  text_color: 0xFFFFFF
                  text: $view_dashboard
              - label:
                  text: "Übersicht"
                  text_font: roboto19_font
                  text_color: 0xFFFFFF
