# =============================================================================
# LVGL TOUCHSCREEN INTERFACE
# =============================================================================
# This file defines the graphical user interface (GUI) for the ESP32 touchscreen
# display. It creates buttons that control smart home devices through Home Assistant.
#
# HOW IT WORKS:
# - Each button sends a command to Home Assistant when pressed (on_press/on_click)
# - Buttons receive state updates from sensors defined in sensors.yaml
# - When a sensor changes, the button's appearance updates (checked/unchecked)
#
# KEY CONCEPTS:
# - "id:" is a unique name used to reference this element from other files
# - "entity_id:" refers to a device/entity in Home Assistant
# - "checkable: true" means the button shows on/off state visually
# - "$variable" values (like $button_width) are defined in template.yaml
# - Sensors in sensors.yaml watch Home Assistant and update button states
# =============================================================================

# =============================================================================
# NOTIFICATION CENTER — state + scripts
# =============================================================================
# - 6 fixed string slots (newest first, slot 0 = newest).
# - notification_count tracks how many slots are active (0..6).
# - HA calls api action "notify" (device.yaml) -> script notif_push.
# - Tapping a list entry -> script notif_dismiss with the slot index.
# - notif_render re-syncs UI: labels, hidden-flags, bell visibility,
#   and auto-closes the panel when the list becomes empty.
# =============================================================================

globals:
  - id: notification_count
    type: int
    restore_value: false
    initial_value: '0'
  - id: notif_text_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_1
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_2
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_3
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_4
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: notif_text_5
    type: std::string
    restore_value: false
    initial_value: '""'
  # Per-slot expire timestamps (seconds since boot, 0 = never expire).
  - id: notif_expire_0
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_1
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_2
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_3
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_4
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: notif_expire_5
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Info-Box view toggle: false = energy flow diagram visible (default), true = 2x2 grid view visible
  - id: info_view_flow_hidden
    type: bool
    restore_value: false
    initial_value: 'false'
  # Tracks whether the notification panel overlay is currently open. Used to
  # skip the idle/backlight auto-return to main_page so an open panel stays open.
  - id: notif_panel_open
    type: bool
    restore_value: false
    initial_value: 'false'
  # Wall-clock millis of the last touch event. The 15s interval below compares
  # against this to drive the idle revert (when the matching HA switch is on).
  - id: last_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  # Central page-navigation entry point. Takes a HA-facing label and routes to
  # the matching LVGL page, while keeping the "Aktive Seite" select in sync via
  # publish_state (avoids triggering the on_value callback again).
  - id: nav_to_page
    # single = ignore concurrent calls; prevents recursion via the
    # active_page_select on_value callback (which also calls this script).
    mode: single
    parameters:
      page: string
    then:
      - lambda: 'id(active_page_select).publish_state(page);'
      - if:
          condition:
            lambda: 'return page == "Begrüßung";'
          then:
            - lvgl.page.show: greeting_page
      - if:
          condition:
            lambda: 'return page == "Übersicht";'
          then:
            - lvgl.page.show: main_page
      - if:
          condition:
            lambda: 'return page == "Szenen";'
          then:
            - lvgl.page.show: scenes_page
      - if:
          condition:
            lambda: 'return page == "Heizung";'
          then:
            - lvgl.page.show: heating_lab_page
      - if:
          condition:
            lambda: 'return page == "Drucker";'
          then:
            - lvgl.page.show: printer_lab_page
      - if:
          condition:
            lambda: 'return page == "Staubi-Saugi";'
          then:
            - lvgl.page.show: vacuum_page

  # Read the HA "Default-Seite" select and navigate there. Called from boot,
  # idle revert, and the backlight off handler.
  - id: nav_to_default_page
    then:
      - script.execute:
          id: nav_to_page
          page: !lambda 'return id(default_page_select).state;'

  - id: notif_push
    mode: queued
    parameters:
      title: string
      message: string
      expire_hours: float
    then:
      - lambda: |-
          // Shift text + expire slots 0..4 down to 1..5, oldest (was 5) is dropped.
          id(notif_text_5)   = id(notif_text_4);
          id(notif_expire_5) = id(notif_expire_4);
          id(notif_text_4)   = id(notif_text_3);
          id(notif_expire_4) = id(notif_expire_3);
          id(notif_text_3)   = id(notif_text_2);
          id(notif_expire_3) = id(notif_expire_2);
          id(notif_text_2)   = id(notif_text_1);
          id(notif_expire_2) = id(notif_expire_1);
          id(notif_text_1)   = id(notif_text_0);
          id(notif_expire_1) = id(notif_expire_0);
          // Compose new entry into slot 0.
          std::string combined = title;
          if (!message.empty()) {
            if (!combined.empty()) combined += ": ";
            combined += message;
          }
          id(notif_text_0) = combined;
          // Compute expire timestamp. 0 = never expire.
          if (expire_hours > 0.0f) {
            uint32_t now_s = (uint32_t)(millis() / 1000ULL);
            id(notif_expire_0) = now_s + (uint32_t)(expire_hours * 3600.0f);
          } else {
            id(notif_expire_0) = 0;
          }
          if (id(notification_count) < 6) {
            id(notification_count) = id(notification_count) + 1;
          }
      - script.execute: notif_render
      # Wake the display (no-op if already on) and pop the panel open so the
      # user actually sees the new notification.
      - light.turn_on:
          id: backlight
      - lvgl.widget.update:
          id: notif_panel
          hidden: false

  - id: notif_dismiss
    mode: queued
    parameters:
      index: int
    then:
      - lambda: |-
          int i = index;
          // Shift entries below the removed one up by one slot (text + expire).
          if (i <= 0) { id(notif_text_0) = id(notif_text_1); id(notif_expire_0) = id(notif_expire_1); }
          if (i <= 1) { id(notif_text_1) = id(notif_text_2); id(notif_expire_1) = id(notif_expire_2); }
          if (i <= 2) { id(notif_text_2) = id(notif_text_3); id(notif_expire_2) = id(notif_expire_3); }
          if (i <= 3) { id(notif_text_3) = id(notif_text_4); id(notif_expire_3) = id(notif_expire_4); }
          if (i <= 4) { id(notif_text_4) = id(notif_text_5); id(notif_expire_4) = id(notif_expire_5); }
          id(notif_text_5) = "";
          id(notif_expire_5) = 0;
          if (id(notification_count) > 0) {
            id(notification_count) = id(notification_count) - 1;
          }
      - script.execute: notif_render

  - id: notif_render
    mode: restart
    then:
      # Slot 0
      - lvgl.label.update:
          id: notif_label_0
          text: !lambda 'return id(notif_text_0);'
      - lvgl.widget.update:
          id: notif_item_0
          hidden: !lambda 'return id(notification_count) < 1;'
      # Slot 1
      - lvgl.label.update:
          id: notif_label_1
          text: !lambda 'return id(notif_text_1);'
      - lvgl.widget.update:
          id: notif_item_1
          hidden: !lambda 'return id(notification_count) < 2;'
      # Slot 2
      - lvgl.label.update:
          id: notif_label_2
          text: !lambda 'return id(notif_text_2);'
      - lvgl.widget.update:
          id: notif_item_2
          hidden: !lambda 'return id(notification_count) < 3;'
      # Slot 3
      - lvgl.label.update:
          id: notif_label_3
          text: !lambda 'return id(notif_text_3);'
      - lvgl.widget.update:
          id: notif_item_3
          hidden: !lambda 'return id(notification_count) < 4;'
      # Slot 4
      - lvgl.label.update:
          id: notif_label_4
          text: !lambda 'return id(notif_text_4);'
      - lvgl.widget.update:
          id: notif_item_4
          hidden: !lambda 'return id(notification_count) < 5;'
      # Slot 5
      - lvgl.label.update:
          id: notif_label_5
          text: !lambda 'return id(notif_text_5);'
      - lvgl.widget.update:
          id: notif_item_5
          hidden: !lambda 'return id(notification_count) < 6;'
      # Bell visibility
      - lvgl.widget.update:
          id: notif_bell
          hidden: !lambda 'return id(notification_count) == 0;'
      # Auto-close panel when nothing left
      - if:
          condition:
            lambda: 'return id(notification_count) == 0;'
          then:
            - lvgl.widget.update:
                id: notif_panel
                hidden: true
            - lambda: 'id(notif_panel_open) = false;'

  # Periodic check: drop slots whose expire timestamp has passed.
  # In-place two-pointer compaction over text + expire arrays.
  - id: notif_check_expired
    mode: restart
    then:
      - lambda: |-
          uint32_t now_s = (uint32_t)(millis() / 1000ULL);
          std::string texts[6] = {
            id(notif_text_0), id(notif_text_1), id(notif_text_2),
            id(notif_text_3), id(notif_text_4), id(notif_text_5)
          };
          uint32_t exps[6] = {
            id(notif_expire_0), id(notif_expire_1), id(notif_expire_2),
            id(notif_expire_3), id(notif_expire_4), id(notif_expire_5)
          };
          int count = id(notification_count);
          int write = 0;
          bool changed = false;
          for (int read = 0; read < count; read++) {
            if (exps[read] == 0 || now_s < exps[read]) {
              if (write != read) {
                texts[write] = texts[read];
                exps[write]  = exps[read];
              }
              write++;
            } else {
              changed = true;
            }
          }
          for (int i = write; i < 6; i++) {
            texts[i] = "";
            exps[i]  = 0;
          }
          if (changed) {
            id(notif_text_0)   = texts[0]; id(notif_expire_0) = exps[0];
            id(notif_text_1)   = texts[1]; id(notif_expire_1) = exps[1];
            id(notif_text_2)   = texts[2]; id(notif_expire_2) = exps[2];
            id(notif_text_3)   = texts[3]; id(notif_expire_3) = exps[3];
            id(notif_text_4)   = texts[4]; id(notif_expire_4) = exps[4];
            id(notif_text_5)   = texts[5]; id(notif_expire_5) = exps[5];
            id(notification_count) = write;
            id(notif_render).execute();
          }

interval:
  - interval: 30s
    then:
      - script.execute: notif_check_expired

  # Idle-revert check. Compares millis() against last_activity_ms (touched by
  # the touchscreen on_touch handler in device.yaml) and reverts to the default
  # page when the HA-configured threshold is exceeded. Skipped while the
  # notification panel is open or the HA-side revert switch is off.
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(idle_revert_enabled).state) return false;
              if (id(notif_panel_open)) return false;
              uint32_t threshold = (uint32_t)(id(idle_timeout_minutes).state * 60.0f * 1000.0f);
              return ((uint32_t) millis() - id(last_activity_ms)) >= threshold;
          then:
            - script.execute: nav_to_default_page

lvgl:
  buffer_size: 100%
  byte_order: little_endian
  displays: my_display
  touchscreens: my_touchscreen
  top_layer:
    widgets:

      # =========================================================================
      # TEMPERATURE DISPLAY (Top-left corner of screen)
      # =========================================================================
      # WHAT IT SHOWS:
      #   Displays two temperatures: "outdoor° / indoor°"
      #   Example: "15° / 22°" means 15°C outside, 22°C in the office
      #
      # WHERE THE DATA COMES FROM (defined in sensors.yaml):
      #   - Left number: sensor.outdoor_temperature (weather/outdoor sensor)
      #   - Right number: sensor.office_temperature (indoor room sensor)
      #
      # HOW IT UPDATES:
      #   When either temperature sensor changes in Home Assistant, the
      #   sensors.yaml file triggers an update to this label's text.
      # =========================================================================
      - label:
          text: "-° / -°"
          id: temperatures
          styles: roboto15_style
          align: top_left
          x: 12
          y: 6
          text_color: 0xFFFFFF

      # =========================================================================
      # CLOCK DISPLAY (Top-center of screen)
      # =========================================================================
      # WHAT IT SHOWS:
      #   Current time in 24-hour format (e.g., "14:30")
      #
      # WHERE THE DATA COMES FROM:
      #   The time component (configured in addon/time.yaml) syncs with
      #   Home Assistant's time and updates this label every minute.
      # =========================================================================
      - label:
          text: "--:--"
          id: display_time
          styles: roboto15_style
          align: top_mid
          x: 0
          y: 6
          text_align: center
          text_color: 0xFFFFFF

      # =========================================================================
      # HOME BATTERY STATE OF CHARGE (Top-right corner)
      # =========================================================================
      # Battery icon + percentage of the home storage (Sonnenbatterie).
      # Bound in sensors.yaml to sensor.sonnenbatterie_217105_state_battery_percentage_user.
      # =========================================================================
      - obj:
          id: battery_box
          align: top_right
          x: -12
          y: 6
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          clickable: false
          layout:
            type: flex
            flex_flow: row
            flex_align_cross: center
            pad_column: 4
          widgets:
            - label:
                text_font: icon_font_small
                text_color: 0xFFFFFF
                text: $battery
            - label:
                id: battery_percentage
                styles: roboto15_style
                text_color: 0xFFFFFF
                text: "--%"

      # =========================================================================
      # NOTIFICATION BELL (Top-right, left of battery)
      # =========================================================================
      # Hidden by default; appears only while there are open notifications.
      # Tap opens the notification panel.
      # =========================================================================
      - label:
          id: notif_bell
          text_font: icon_font_small
          text_color: 0xFFFFFF
          text: $bell
          align: top_right
          x: -120
          y: 6
          hidden: true
          clickable: true
          on_click:
            - lvgl.widget.update:
                id: notif_panel
                hidden: false
            - lambda: 'id(notif_panel_open) = true;'

      # =========================================================================
      # VOICE ASSISTANT OVERLAY (full-screen, top_layer)
      # =========================================================================
      # Shown automatically by voice_assistant events in addon/audio.yaml.
      # Pulsing colored border driven by an interval in audio.yaml (cycles
      # through 4 colors every 400ms while voice_active=true).
      # Three labels: state (top), recognized text (middle), response (bottom).
      # Clickable obj so taps don't fall through to widgets behind.
      # =========================================================================
      - obj:
          id: voice_overlay
          width: 100%
          height: 100%
          align: center
          bg_color: 0x000000
          bg_opa: 75%
          border_width: 8
          border_color: 0xE06A2A
          radius: 0
          pad_all: 32
          hidden: true
          clickable: true
          widgets:
            - label:
                id: voice_overlay_state
                text: "Höre zu…"
                text_font: roboto36_font
                text_color: 0xFFFFFF
                align: top_mid
                y: 60
            - label:
                id: voice_overlay_stt
                text: ""
                text_font: roboto19_font
                text_color: 0xB0B0B0
                align: center
                y: -20
                text_align: center
                long_mode: wrap
                width: 600px
            - label:
                id: voice_overlay_tts
                text: ""
                text_font: roboto19_font
                text_color: 0xFFFFFF
                align: center
                y: 80
                text_align: center
                long_mode: wrap
                width: 600px

      # =========================================================================
      # NOTIFICATION PANEL (full-screen overlay, top_layer)
      # =========================================================================
      # Hidden by default. Opened by tapping the bell. Tap on the dim
      # background closes the panel. Tap on a list entry dismisses that entry.
      # =========================================================================
      - obj:
          id: notif_panel
          width: 100%
          height: 100%
          align: center
          bg_color: 0x000000
          bg_opa: 80%
          border_width: 0
          pad_all: 0
          hidden: true
          clickable: true
          on_click:
            - lvgl.widget.update:
                id: notif_panel
                hidden: true
            - lambda: 'id(notif_panel_open) = false;'
          widgets:
            - obj:
                id: notif_panel_box
                width: 640px
                height: 600px
                align: top_mid
                y: 50
                bg_color: 0x2A2A2A
                bg_opa: cover
                border_width: 2
                border_color: 0xE06A2A
                radius: 16
                pad_all: 20
                clickable: true
                layout:
                  type: flex
                  flex_flow: column
                  pad_row: 10
                widgets:
                  # Header row
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      clickable: false
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_main: space_between
                        flex_align_cross: center
                      widgets:
                        - label:
                            text: "Mitteilungen"
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                        - label:
                            text_font: icon_font_small
                            text_color: 0xB0B0B0
                            text: $close
                            clickable: true
                            on_click:
                              - lvgl.widget.update:
                                  id: notif_panel
                                  hidden: true
                              - lambda: 'id(notif_panel_open) = false;'

                  # List items (each tappable to dismiss)
                  - obj:
                      id: notif_item_0
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_0
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 0

                  - obj:
                      id: notif_item_1
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_1
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 1

                  - obj:
                      id: notif_item_2
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_2
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 2

                  - obj:
                      id: notif_item_3
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_3
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 3

                  - obj:
                      id: notif_item_4
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_4
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 4

                  - obj:
                      id: notif_item_5
                      width: 100%
                      height: 70px
                      bg_color: 0x3A3A3A
                      bg_opa: cover
                      border_width: 0
                      radius: 8
                      pad_left: 16
                      pad_right: 16
                      pad_top: 0
                      pad_bottom: 0
                      hidden: true
                      clickable: true
                      layout:
                        type: flex
                        flex_flow: row
                        flex_align_cross: center
                      widgets:
                        - label:
                            id: notif_label_5
                            text: ""
                            text_font: roboto19_font
                            text_color: 0xFFFFFF
                      on_click:
                        - script.execute:
                            id: notif_dismiss
                            index: 5

  pages:
    # =========================================================================
    # GREETING PAGE — gridless welcome view with clock, greeter, weather forecast
    # =========================================================================
    # Layout is absolute (no LVGL layout) so children sit exactly where align/x/y
    # places them. The 4-slot forecast row uses an inner grid so the columns line
    # up evenly. All dynamic labels are driven by the time_update script
    # (clock / date / greeter) and the HA forecast sensors (icon / time / temp).
    # =========================================================================
    - id: greeting_page
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_color: 0x1E1E1E
      bg_opa: cover
      pad_top: 60
      pad_left: 8
      pad_right: 8
      pad_bottom: 8
      widgets:
        # Big clock (HH:MM)
        - label:
            id: greeting_clock_label
            align: top_mid
            y: 30
            text: "--:--"
            text_font: roboto72_font
            text_color: 0xFFFFFF

        # Greeting line — "Guten Morgen, Nicklas"
        - label:
            id: greeting_message_label
            align: top_mid
            y: 200
            text: "Hallo"
            text_font: roboto36_font
            text_color: 0xFFFFFF

