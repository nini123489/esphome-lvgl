    - id: main_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1)]
      scrollbar_mode: "off"
      scroll_dir: "hor"
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 51
      pad_bottom: 8
      pad_left: 8
      pad_right: 8

      widgets:

        # =========================================================================
        # BUTTON: Scenes (opens scene selector page)
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            id: scenes_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $lightbulb
              - label:
                  align: bottom_left
                  text: "Szenen"
            on_click:
              - script.execute:
                  id: nav_to_page
                  page: "Szenen"

        # =========================================================================
        # BUTTON: 3D Printer (opens detail page)
        # =========================================================================
        # WHAT THIS BUTTON DOES:
        #   Opens the printer detail page (printer_lab_page) where the user can
        #   toggle power and see live status (power draw, print progress, state).
        #
        # HOW THE BUTTON KNOWS IF IT'S ACTIVE:
        #   sensors.yaml monitors: switch.3d_drucker
        #   When the switch is ON, this button appears "checked" (highlighted)
        #   When the switch is OFF, this button appears unchecked (dimmed)
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            id: printer_power_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            widgets:
              # Icon (shown when OFF)
              - label:
                  text_font: $icon_font
                  align: top_left
                  id: printer_power_icon
                  text: $printer
              # Progress (shown when ON)
              - obj:
                  align: top_left
                  id: print_progress_container
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: end
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  hidden: true
                  widgets:
                    - label:
                        text_font: roboto44_font
                        text_color: 0xFFFFFF
                        id: print_progress_label
                        text: "--"
                    - label:
                        text_font: roboto17_font
                        text_color: 0xFFFFFF
                        text: "%"
              - label:
                  align: bottom_left
                  id: printer_power_label
                  text: "3D Drucker"
            on_click:
              - script.execute:
                  id: nav_to_page
                  page: "Drucker"

        # =========================================================================
        # HEATING CONTROL CARD: Eve thermostat (col 1, row 0)
        # =========================================================================
        # Shows target temperature (large) + current temperature (small) for
        # climate.eve_thermo_20ebp1701, with -/+ buttons that adjust the target
        # in 0.5°C steps via the HA climate.set_temperature service.
        # Values are wired in sensors.yaml (heating_main_current_temp,
        # heating_main_target_temp).
        # =========================================================================
        - obj:
            id: heating_main_card
            width: $button_width
            height: $button_height_single
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            bg_color: $button_control_color
            radius: $radius
            border_width: 0
            pad_all: 14
            clickable: false
            layout:
              type: flex
              flex_flow: column
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              # Top: icon + label (left) + power on/off button (right)
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - obj:
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: row
                          flex_align_cross: center
                          pad_column: 8
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $thermometer
                          - label:
                              text: "Heizung"
                              text_font: roboto17_font
                              text_color: 0xFFFFFF
                    - button:
                        id: heating_main_power_button
                        width: 50
                        height: 32
                        bg_color: 0x3A3A3A
                        radius: 6
                        pad_all: 0
                        checkable: true
                        widgets:
                          - label:
                              align: center
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $power
                        on_click:
                          - homeassistant.service:
                              service: climate.set_hvac_mode
                              data:
                                entity_id: climate.eve_thermo_20ebp1701
                                hvac_mode: !lambda |-
                                  if (id(heating_main_hvac_mode).has_state() && id(heating_main_hvac_mode).state != "off") {
                                    return std::string("off");
                                  }
                                  return std::string("heat");

              # Middle: target (big) + current (small)
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: column
                    flex_align_cross: center
                    pad_row: 2
                  widgets:
                    - label:
                        id: heating_main_target_label
                        text: "--.-°"
                        text_font: roboto36_font
                        text_color: 0xFFFFFF
                    - label:
                        id: heating_main_current_label
                        text: "~ --.-°"
                        text_font: roboto15_font
                        text_color: 0xB0B0B0

              # Bottom: -/+ buttons
              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: space_between
                    flex_align_cross: center
                  widgets:
                    - button:
                        id: heating_main_down_button
                        width: 70
                        height: 44
                        bg_color: 0x3A3A3A
                        radius: 8
                        pad_all: 0
                        widgets:
                          - label:
                              align: center
                              text: "-"
                              text_font: roboto36_font
                              text_color: 0xFFFFFF
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.eve_thermo_20ebp1701
                                hvac_mode: heat
                                temperature: !lambda |-
                                  if (id(heating_main_target_temp).has_state()) {
                                    return id(heating_main_target_temp).state - 0.5f;
                                  }
                                  return 20.0f;
                    - button:
                        id: heating_main_up_button
                        width: 70
                        height: 44
                        bg_color: 0x3A3A3A
                        radius: 8
                        pad_all: 0
                        widgets:
                          - label:
                              align: center
                              text: "+"
                              text_font: roboto36_font
                              text_color: 0xFFFFFF
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.eve_thermo_20ebp1701
                                hvac_mode: heat
                                temperature: !lambda |-
                                  if (id(heating_main_target_temp).has_state()) {
                                    return id(heating_main_target_temp).state + 0.5f;
                                  }
                                  return 20.0f;

        # =========================================================================
        # BUTTON: Vacuum robot (opens vacuum page)
        # =========================================================================
        - button:
            height: $button_height_single
            width: $button_width
            id: vacuum_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $vacuum
              - label:
                  align: bottom_left
                  text: "Staubi-Saugi"
            on_click:
              - script.execute:
                  id: nav_to_page
                  page: "Staubi-Saugi"

        # =========================================================================
        # INFO BOX: Solar PV system visualization (spans rows 1-2, cols 0-1)
        # =========================================================================
        # Two views switchable via the toggle button in the top-right corner:
        #   View A (info_view_flow): energy flow diagram (default visible)
        #   View B (info_view_grid): battery SOC bar + compact list of 4 metrics
        # Direction-coded values (grid in/out, battery in/out) use a pair of
        # stacked white/orange labels; the sensor lambdas toggle their hidden
        # flags based on sign. Positive = orange (export / discharging),
        # negative = white (import / charging).
        # =========================================================================
        - obj:
            id: info_box
            width: 460px
            height: 430px
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_column_span: 2
            grid_cell_row_span: 2
            styles: control
            clickable: false
            pad_all: 0
            widgets:

              # =====================================================================
              # VIEW A — Energy flow diagram (default visible)
              # =====================================================================
              - obj:
                  id: info_view_flow
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: $padding
                  clickable: false
                  hidden: false
                  layout:
                    type: grid
                    grid_columns: [fr(1), fr(1), fr(1)]
                    grid_rows: [fr(1), fr(1), fr(1)]
                  widgets:
                    # Solar — top arm (col 1, row 0)
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 0
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              text: $solar_power
                          - label:
                              text: "Solar"
                              text_font: roboto15_font
                              text_color: 0xB0B0B0
                          - label:
                              id: flow_solar_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: 0xFFFFFF

                    # Netz — left arm (col 0, row 1)
                    - obj:
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 1
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $transmission_tower
                          - label:
                              text: "Netz"
                              text_font: roboto15_font
                              text_color: 0xB0B0B0
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                              widgets:
                                - label:
                                    id: flow_grid_value_white
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: 0xFFFFFF
                                - label:
                                    id: flow_grid_value_orange
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: 0xFF8C00
                                    hidden: true

                    # Akku — right arm (col 2, row 1)
                    - obj:
                        grid_cell_column_pos: 2
                        grid_cell_row_pos: 1
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $battery_charging
                          - label:
                              text: "Akku"
                              text_font: roboto15_font
                              text_color: 0xB0B0B0
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              clickable: false
                              layout:
                                type: flex
                                flex_flow: row
                                flex_align_cross: center
                              widgets:
                                - label:
                                    id: flow_batt_value_white
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: 0xFFFFFF
                                - label:
                                    id: flow_batt_value_orange
                                    text: "-- W"
                                    text_font: roboto19_font
                                    text_color: 0xFF8C00
                                    hidden: true

                    # Verbrauch — bottom arm (col 1, row 2)
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 2
                        grid_cell_x_align: center
                        grid_cell_y_align: center
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        layout:
                          type: flex
                          flex_flow: column
                          flex_align_main: center
                          flex_align_cross: center
                          pad_row: 4
                        widgets:
                          - label:
                              text_font: icon_font_small
                              text_color: 0xFFFFFF
                              text: $house
                          - label:
                              text: "Verbrauch"
                              text_font: roboto15_font
                              text_color: 0xB0B0B0
                          - label:
                              id: flow_house_value
                              text: "-- W"
                              text_font: roboto19_font
                              text_color: 0xFFFFFF

                    # Center — flow direction arrows (col 1, row 1)
                    # No layout: children are placed via align inside the cell.
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 1
                        grid_cell_x_align: stretch
                        grid_cell_y_align: stretch
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        widgets:
                          # All center arrows start hidden; the sensor on_value
                          # handlers reveal them as soon as a non-zero flow value
                          # arrives from Home Assistant.
                          # Solar → center (down, hidden when production = 0)
                          - label:
                              id: flow_center_solar_arrow
                              align: top_mid
                              text: $arrow_down_bold
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              hidden: true
                          # center → Verbrauch (down, hidden when consumption = 0)
                          - label:
                              id: flow_center_house_arrow
                              align: bottom_mid
                              text: $arrow_down_bold
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              hidden: true
                          # Grid: left = export, right = import (hidden when 0)
                          - label:
                              id: flow_center_grid_arrow
                              align: left_mid
                              text: $arrow_left_bold
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              hidden: true
                          # Battery: left = discharge, right = charge (hidden when 0)
                          - label:
                              id: flow_center_batt_arrow
                              align: right_mid
                              text: $arrow_left_bold
                              text_font: icon_font_small
                              text_color: 0xFF8C00
                              hidden: true

              # =====================================================================
              # VIEW B — Battery SOC bar + compact metric list (hidden by default)
              # =====================================================================
