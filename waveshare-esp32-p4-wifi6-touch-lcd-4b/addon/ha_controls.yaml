# =============================================================================
# HOME ASSISTANT CONTROLS — exposed entities
# =============================================================================
# Entities this device publishes to HA so users can remote-control the display
# and the auto-revert behavior:
#   Select  "Aktive Seite"        -> jumps the display to the chosen page now
#   Select  "Default-Seite"       -> page used on boot, idle revert, display-off revert
#   Switch  "Revert bei Idle"     -> enables the idle timer (interval lives in lvgl.yaml)
#   Switch  "Revert bei Display aus" -> enables revert when backlight goes off
#   Switch  "Mitteilungen einklappen" -> hide the notification row while it is empty
#   Number  "Idle-Zeit (min)"     -> threshold for the idle revert
#
# All controls use restore_value/restore_mode so the user's last setting survives
# reboot. The two selects share the same options list, kept in sync manually.
# =============================================================================

select:
  - platform: template
    name: "Aktive Seite"
    id: active_page_select
    options:
      - "Übersicht"
      - "Szenen"
      - "Heizung"
      - "Drucker"
      - "Staubi-Saugi"
      - "Wetter"
      - "Energie"
      - "Mehr"
    initial_option: "Übersicht"
    optimistic: true
    restore_value: false
    on_value:
      - script.execute:
          id: nav_to_page
          page: !lambda 'return x;'

  - platform: template
    name: "Default-Seite"
    id: default_page_select
    options:
      - "Übersicht"
      - "Szenen"
      - "Heizung"
      - "Drucker"
      - "Staubi-Saugi"
      - "Wetter"
      - "Energie"
      - "Mehr"
    initial_option: "Übersicht"
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "Revert bei Idle"
    id: idle_revert_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Revert bei Display aus"
    id: display_off_revert_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # When on, the dashboard's notification row disappears while both slots are
  # empty and the stack card grows into the freed space. When off, the row keeps
  # its place and shows a "Keine Mitteilungen" placeholder instead.
  - platform: template
    name: "Mitteilungen einklappen"
    id: collapse_notify
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: notif_render
    on_turn_off:
      - script.execute: notif_render

number:
  - platform: template
    name: "Idle-Zeit (min)"
    id: idle_timeout_minutes
    min_value: 0.5
    max_value: 60
    step: 0.5
    initial_value: 2
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
