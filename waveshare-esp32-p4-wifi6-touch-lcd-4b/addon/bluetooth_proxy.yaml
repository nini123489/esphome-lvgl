# =============================================================================
# BLUETOOTH PROXY (for Bermuda BLE Trilateration / Room Presence)
# =============================================================================
# Turns this device into a Home Assistant Bluetooth Proxy. It scans for BLE
# advertisements and forwards them (with RSSI) to Home Assistant, where the
# Bermuda integration uses the signal strength from multiple proxies to
# estimate the room/position of tracked BLE devices.
#
# HARDWARE NOTE:
# The ESP32-P4 has no radio of its own. Bluetooth comes from the onboard
# ESP32-C6 helper chip over SDIO (configured as `esp32_hosted` in device.yaml).
# BLE therefore shares the same hosted link as Wi-Fi.
#
# BERMUDA SETUP (Home Assistant side):
#   1. Flash this config and let the device come online.
#   2. HA auto-discovers it as a Bluetooth Proxy — accept the discovery.
#   3. Add/enable the "Bermuda BLE Trilateration" integration (HACS).
#   4. Bermuda picks up this proxy automatically as a scanner/receiver.
#
# For trilateration you want several proxies spread across the home so each
# tracked device is heard by more than one receiver.
# =============================================================================

# -----------------------------------------------------------------------------
# BLE SCANNER
# -----------------------------------------------------------------------------
# active: true  -> also sends scan requests, so we receive scan-response
#                  packets (device names, extra data). Bermuda benefits from
#                  the richer data. Set to false for lower-power passive-only
#                  scanning if the hosted link is under load.
# interval/window equal -> continuous scanning (best coverage for presence).
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# -----------------------------------------------------------------------------
# BLUETOOTH PROXY
# -----------------------------------------------------------------------------
# active: true lets Home Assistant also open outgoing BLE connections through
# this proxy (e.g. for BLE sensors/switches). Bermuda itself only needs the
# advertisement stream, but leaving connections enabled makes the proxy fully
# featured. Drop to `active: false` to advertise-forward only.
bluetooth_proxy:
  active: true
