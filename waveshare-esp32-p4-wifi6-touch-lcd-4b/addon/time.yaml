# Snmp Time
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

# Dashboard header clock + date
# time_update runs on SNTP sync and every minute at :00. All actions are gated
# behind sntp_time.now().is_valid() so this script is safe to call before the
# clock has synced (returns silently).
script:
  - id: time_update
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            # Dashboard header clock, large (HH:MM)
            - lvgl.label.update:
                id: main_clock_label
                text: !lambda |-
                  static char buf[8];
                  auto now = id(sntp_time).now();
                  snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
                  return std::string(buf);
            # Dashboard header date, small — "Sa, 18. Juli"
            - lvgl.label.update:
                id: main_date_label
                text: !lambda |-
                  static const char* WD[] = {"", "So","Mo","Di","Mi","Do","Fr","Sa"};
                  static const char* MO[] = {"", "Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"};
                  auto now = id(sntp_time).now();
                  int dow = now.day_of_week;
                  int mo  = now.month;
                  if (dow < 1 || dow > 7) dow = 0;
                  if (mo  < 1 || mo  > 12) mo  = 0;
                  char buf[64];
                  snprintf(buf, sizeof(buf), "%s, %d. %s", WD[dow], now.day_of_month, MO[mo]);
                  return std::string(buf);