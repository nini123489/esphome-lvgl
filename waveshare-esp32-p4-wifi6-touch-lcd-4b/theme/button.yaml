substitutions:
  icon_font: icon_font
  text_font: roboto19_font
  button_on_color: "0xFF8C00"
  button_text_color: "0xFFFFFF"
  # Surface palette, darkest to lightest:
  #   page_bg     — the display background everything sits on
  #   status_bg   — strip behind the dashboard status line
  #   stack_side_bg — the stack widget's tab column
  #   button_control_color — every card, tile and button
  #   control_inner_color  — controls sitting *inside* a card (the -/+ circles),
  #                          one step lighter so they stay visible on it
  page_bg_color: "0x181818"
  status_bg_color: "0x151515"
  stack_side_bg_color: "0x1D1D1D"
  button_control_color: "0x242424"
  control_inner_color: "0x2E2E2E"
  button_webhook_color: "0x212121"
  button_height_single: 210px
  button_width: 225px
  padding: 18px
  radius: 28px
  slider_background_color: "0x505050"
  slider_active_color: "0x2D2D2D"
  slider_knob_color: "0xE5E5E5"

lvgl:
  style_definitions:
    - id: webhook
      bg_color: $button_webhook_color

    - id: control
      bg_color: $button_control_color

  theme:
    button:
      text_font: $text_font
      scroll_on_focus: false
      radius: $radius
      width: $button_width
      height: $button_height_single
      pad_all: $padding
      shadow_width: 0
      text_color: $button_text_color
      checked:
        bg_color: $button_on_color
        text_color: $button_text_color
